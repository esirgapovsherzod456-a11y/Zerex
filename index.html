<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Zerex — Telegram Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-image: url("https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=1200&q=80");
      --wood-top: #c88446;
      --wood-mid: #8e5222;
      --wood-bot: #532c0e;
      --gold-bright: #ffe68a;
      --gold-mid: #f5b418;
      --violet-glow: #9b4dff;
      --text-primary: #f7faf7;
      --text-secondary: #c9ddd0;
      --radius-xl: 22px;
      --radius-lg: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      color: var(--text-primary);
      background-color: #09150e;
      background-image:
        linear-gradient(180deg, rgba(16, 12, 6, 0.72) 0%, rgba(11, 23, 15, 0.84) 55%, rgba(5, 12, 8, 0.95) 100%),
        var(--bg-image);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      overflow-x: hidden;
      padding-bottom: 28px;
    }

    .app {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 14px 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .profile-box {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      max-width: 170px;
    }

    .avatar-ring {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(145deg, var(--gold-bright), var(--gold-mid), var(--violet-glow));
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7), 0 0 16px rgba(245, 180, 24, 0.35);
      overflow: hidden;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #102118;
      display: block;
      color: transparent;
    }

    .nick-badge {
      max-width: 165px;
      background: rgba(11, 27, 19, 0.9);
      border: 1px solid rgba(255, 230, 138, 0.5);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--gold-bright);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .level-pill {
      background: rgba(9, 22, 15, 0.9);
      border: 1px solid rgba(255, 230, 138, 0.32);
      border-radius: 10px;
      padding: 4px 9px;
      font-size: 11.5px;
      font-weight: 700;
    }

    .wallet-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .balance-readout {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(10, 25, 17, 0.9);
      border: 1px solid rgba(255, 230, 138, 0.42);
      padding: 6px 12px;
      border-radius: 14px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.55);
    }

    .balance-amount {
      font-size: 25px;
      font-weight: 900;
      background: linear-gradient(180deg, #fff5bf, #f5b418);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .coin-g {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff4b8, #f5b418 58%, #9c5e00 100%);
      border: 2px solid #ffe99e;
      color: #462500;
      font-weight: 900;
      font-size: 15px;
      display: grid;
      place-items: center;
    }

    .deposit-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(180deg, #d68e49 0%, #965722 55%, #5c310e 100%);
      border: 2px solid #f0be82;
      border-radius: 13px;
      padding: 7px 14px;
      color: #fff8e6;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 5px 0 #3a1d06, 0 10px 18px rgba(0, 0, 0, 0.6);
    }

    .center-status {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 8px;
      gap: 8px;
    }

    .zerex-crest {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 34, 24, 0.88);
      border: 1px solid rgba(183, 128, 255, 0.55);
      padding: 5px 15px;
      border-radius: 999px;
    }

    .zerex-z {
      font-weight: 950;
      font-size: 15px;
      background: linear-gradient(180deg, #ffffff, #cfa6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .zerex-tagline {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.1px;
      color: var(--gold-bright);
    }

    .online-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(10, 26, 18, 0.92);
      border: 1px solid rgba(72, 229, 91, 0.5);
      padding: 6px 15px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 800;
      color: #e8ffec;
    }

    .online-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #2fe65b;
      box-shadow: 0 0 10px #2fe65b, 0 0 18px rgba(47, 230, 91, 0.7);
    }

    .side-menus-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 14px;
      gap: 12px;
    }

    .side-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .side-col.right {
      align-items: flex-end;
    }

    .wood-tile-btn {
      width: 88px;
      background: transparent;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .wood-tile-btn:active {
      transform: scale(0.95);
    }

    .wood-box {
      width: 64px;
      height: 58px;
      border-radius: 14px;
      background: linear-gradient(180deg, var(--wood-top) 0%, var(--wood-mid) 56%, var(--wood-bot) 100%);
      border: 2px solid #f0be82;
      box-shadow: 0 5px 0 #361905, 0 10px 16px rgba(0, 0, 0, 0.65);
      display: grid;
      place-items: center;
      font-size: 26px;
      position: relative;
    }

    .wood-box::after {
      content: "";
      position: absolute;
      top: -4px;
      left: 6px;
      width: 18px;
      height: 8px;
      border-radius: 10px 10px 2px 10px;
      background: linear-gradient(180deg, #86e35b, #36942a);
      pointer-events: none;
    }

    .wood-label {
      font-size: 11px;
      font-weight: 800;
      text-align: center;
      line-height: 1.15;
      color: #fff7e3;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.95);
    }

    .games-section {
      margin-top: 22px;
      background: rgba(10, 23, 16, 0.72);
      border: 1px solid rgba(255, 230, 138, 0.25);
      border-radius: 18px;
      padding: 10px 8px;
    }

    .games-strip {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    .game-chip {
      background: transparent;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    .game-chip.active {
      transform: translateY(-3px);
    }

    .game-art {
      width: 48px;
      height: 48px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      font-size: 23px;
      border: 2px solid rgba(255, 230, 138, 0.5);
      box-shadow: 0 5px 0 rgba(10, 20, 14, 0.95), 0 9px 16px rgba(0, 0, 0, 0.6);
    }

    .game-chip.active .game-art {
      border-color: var(--gold-bright);
      box-shadow: 0 0 0 2px rgba(245, 180, 24, 0.65), 0 0 16px rgba(245, 180, 24, 0.35);
    }

    .art-shashka { background: linear-gradient(145deg, #d98c46, #6d3810); }
    .art-shaxmat { background: linear-gradient(145deg, #5677a3, #1f2f45); }
    .art-bilyard { background: linear-gradient(145deg, #25a35f, #0b4a28); }
    .art-durak   { background: linear-gradient(145deg, #b83d59, #4f1421); }
    .art-mafia   { background: linear-gradient(145deg, #4b3578, #190f2e); }
    .art-xo      { background: linear-gradient(145deg, #743bc9, #28104d); }

    .game-name {
      font-size: 10px;
      font-weight: 800;
      color: #f5f9f6;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95);
    }

    .play-wrap {
      margin-top: 14px;
      display: flex;
      justify-content: center;
    }

    .play-btn {
      width: 82%;
      max-width: 310px;
      padding: 16px 24px;
      border-radius: 18px;
      border: 2px solid #f0be82;
      background: linear-gradient(180deg, #d48c48 0%, #945521 58%, #5b300e 100%);
      box-shadow: 0 7px 0 #341804, 0 14px 26px rgba(0, 0, 0, 0.7);
      color: #422006;
      font-size: 28px;
      font-weight: 950;
      letter-spacing: 2px;
      cursor: pointer;
    }

    .play-btn:active {
      transform: translateY(4px);
    }

    .selected-game-hint {
      text-align: center;
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    .selected-game-hint strong {
      color: var(--gold-bright);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 5, 0.88);
      backdrop-filter: blur(7px);
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 455px;
      max-height: 94vh;
      overflow-y: auto;
      background:
        radial-gradient(circle at 50% 15%, rgba(245, 180, 24, 0.14), transparent 55%),
        linear-gradient(180deg, #24180c 0%, #141c13 55%, #0a120c 100%);
      border: 2px solid rgba(240, 190, 130, 0.55);
      border-radius: var(--radius-xl);
      padding: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 230, 138, 0.16);
    }

    .modal-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 900;
      color: var(--gold-bright);
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    .prize-banner-top {
      text-align: center;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.6px;
      color: #fff3c4;
      text-shadow: 0 0 14px rgba(245, 180, 24, 0.45);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .player-strip-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(18, 15, 10, 0.85);
      border: 1px solid rgba(255, 230, 138, 0.22);
      border-radius: 15px;
      padding: 8px 11px;
      margin-bottom: 8px;
    }

    .player-strip-card.active-turn-card {
      border-color: #ffe68a;
      box-shadow: 0 0 14px rgba(245, 180, 24, 0.25);
    }

    .player-left-info {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .player-mini-ava {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 14px;
      color: #fff;
      border: 1.5px solid rgba(255, 230, 138, 0.5);
      flex-shrink: 0;
      object-fit: cover;
    }

    .player-name-line {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 800;
      color: #fff;
    }

    .lvl-tag {
      background: linear-gradient(180deg, #9b5de5, #6930c3);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .sub-timer-line {
      font-size: 11.5px;
      color: #d4c49e;
      margin-top: 2px;
      font-weight: 700;
    }

    .thinking-highlight {
      color: #ffe68a;
    }

    .clock-pill {
      background: rgba(45, 32, 16, 0.92);
      border: 1px solid rgba(255, 230, 138, 0.28);
      border-radius: 11px;
      padding: 6px 10px;
      font-size: 14px;
      font-weight: 900;
      color: #f4e6c4;
      font-variant-numeric: tabular-nums;
    }

    .wood-frame-board {
      background: linear-gradient(145deg, #4b2d16 0%, #241307 100%);
      border: 3px solid #7c4b23;
      border-radius: 18px;
      padding: 8px;
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.8), inset 0 1px 2px rgba(255, 224, 160, 0.3);
      margin: 6px 0;
    }

    .board-8x8 {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
    }

    .sq-8x8 {
      display: grid;
      place-items: center;
      aspect-ratio: 1 / 1;
      cursor: pointer;
      position: relative;
    }

    .sq-light { background: #dec196; }
    .sq-dark  { background: #261b12; }
    .sq-selected { outline: 3px solid #ffe68a; outline-offset: -3px; }
    .sq-capture-hint::after {
      content: "";
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 230, 138, 0.85);
      box-shadow: 0 0 8px #ffe68a;
    }

    .checker-white {
      width: 78%;
      height: 78%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff, #d9cfc1 70%, #9e9180 100%);
      border: 2px solid #f7f3eb;
      box-shadow: 0 4px 7px rgba(0, 0, 0, 0.7), inset 0 -2px 4px rgba(0, 0, 0, 0.25);
    }

    .checker-black {
      width: 78%;
      height: 78%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #46423d, #1c1917 72%, #090807 100%);
      border: 2px solid #5c544b;
      box-shadow: 0 4px 7px rgba(0, 0, 0, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.14);
    }

    .turn-status-pill {
      margin: 8px auto;
      width: fit-content;
      padding: 6px 16px;
      border-radius: 999px;
      background: linear-gradient(180deg, #275c3b, #143621);
      border: 1px solid rgba(116, 235, 152, 0.45);
      color: #d7ffe4;
      font-size: 11.5px;
      font-weight: 900;
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    .turn-status-pill.thinking-pill {
      background: linear-gradient(180deg, #593b14, #2e1d08);
      border-color: rgba(255, 230, 138, 0.55);
      color: #ffe99e;
    }

    .gramora-bottom-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .round-icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1.5px solid rgba(240, 190, 130, 0.5);
      background: linear-gradient(180deg, #4b3117, #241609);
      color: #ffe68a;
      font-size: 18px;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .round-icon-btn.active-mic {
      background: linear-gradient(180deg, #28a745, #145c26);
      color: #fff;
    }

    .wood-action-pill {
      flex: 1;
      height: 42px;
      border-radius: 13px;
      border: 1.5px solid rgba(240, 190, 130, 0.48);
      background: linear-gradient(180deg, #4d3218, #261709);
      color: #f6e7c8;
      font-weight: 800;
      font-size: 12.5px;
      cursor: pointer;
    }

    .wood-action-pill.voted {
      background: linear-gradient(180deg, #ffe385, #d99514);
      color: #241300;
    }

    .stake-one-row {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 6px;
      padding-bottom: 4px;
    }

    .stake-pill {
      flex: 0 0 auto;
      padding: 6px 10px;
      border-radius: 10px;
      border: 1.5px solid rgba(240, 190, 130, 0.45);
      background: linear-gradient(180deg, #5e3717 0%, #341c09 100%);
      color: #fff3cf;
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }

    .stake-pill.active {
      background: linear-gradient(180deg, #ffe385 0%, #f5b418 65%, #b57400 100%);
      color: #261400;
    }

    .deposit-amount-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(25, 19, 11, 0.88);
      border: 1px solid rgba(255, 230, 138, 0.25);
      border-radius: 15px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .copy-gold-btn {
      padding: 9px 14px;
      border-radius: 12px;
      border: 1px solid #ffe68a;
      background: linear-gradient(180deg, #ffe385 0%, #e5a115 65%, #b57704 100%);
      color: #261400;
      font-weight: 900;
      font-size: 12px;
      cursor: pointer;
    }

    .warn-amber-box {
      background: linear-gradient(180deg, rgba(120, 74, 14, 0.55), rgba(66, 39, 7, 0.65));
      border: 1.5px solid rgba(245, 180, 24, 0.65);
      border-radius: 14px;
      padding: 11px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: #ffe89e;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .pay-methods-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
      margin-bottom: 10px;
    }

    .pay-method-btn {
      padding: 9px;
      border-radius: 11px;
      border: 1.5px solid rgba(255, 230, 138, 0.35);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
    }

    .pay-method-btn.active {
      border-color: var(--gold-bright);
      background: rgba(245, 180, 24, 0.24);
      color: var(--gold-bright);
    }

    .gold-cta-btn {
      width: 100%;
      padding: 13px 14px;
      border-radius: 14px;
      border: 1.5px solid #ffe68a;
      background: linear-gradient(180deg, #ffd866 0%, #e5a115 65%, #b57704 100%);
      color: #2b1600;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 0 #694100;
      margin-top: 8px;
    }

    .section-box {
      background: rgba(7, 17, 12, 0.84);
      border: 1px solid rgba(255, 230, 138, 0.15);
      border-radius: var(--radius-lg);
      padding: 11px;
      margin-bottom: 10px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-secondary);
      margin-bottom: 7px;
      text-transform: uppercase;
      text-align: center;
    }

    .xo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      max-width: 220px;
      margin: 8px auto;
    }

    .xo-cell {
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      border: 1px solid rgba(255, 230, 138, 0.45);
      background: rgba(255, 255, 255, 0.08);
      color: var(--gold-bright);
      font-size: 26px;
      font-weight: 900;
      cursor: pointer;
    }

    .outcome-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-top: 8px;
    }

    .outcome-btn {
      padding: 8px 5px;
      border-radius: 10px;
      border: none;
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
      color: #fff;
    }

    .outcome-win { background: linear-gradient(180deg, #27a852, #176b33); }
    .outcome-draw { background: linear-gradient(180deg, #eab308, #a16207); color: #1a1100; }
    .outcome-loss { background: linear-gradient(180deg, #d94343, #8c2323); }

    .task-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 11px;
      border-radius: 15px;
      background: linear-gradient(180deg, #593314 0%, #381e0a 100%);
      border: 1.5px solid rgba(240, 190, 130, 0.35);
      margin-bottom: 9px;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .task-icon-box {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.28);
      display: grid;
      place-items: center;
      font-size: 20px;
    }

    .task-title {
      font-size: 12.5px;
      font-weight: 900;
      color: #fff6e0;
    }

    .task-reward {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--gold-bright);
    }

    .task-action-btn {
      padding: 8px 12px;
      border-radius: 11px;
      border: 1px solid #ffe68a;
      background: linear-gradient(180deg, #f7cb59 0%, #d99514 100%);
      color: #291500;
      font-weight: 900;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }

    .leader-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 10px;
      border-radius: 12px;
      background: rgba(16, 39, 27, 0.9);
      border: 1px solid rgba(255, 230, 138, 0.15);

    }

    .rating-tabs {
      display: grid;

    .rating-tab {

      border-radius: 11px;
      border: 1px solid rgba(240, 190, 130, 0.45);
      background: linear-gradient(180deg, #6e411b 0%, #3d220c 100%);
      color: #f3e5cf;
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
    }

    .rating-tab.active {
      background: linear-gradient(180deg, #ffe385 0%, #f5b418 65%, #b87704 100%);
      color: #2b1700;
    }

    .leaderboard-list {
      max-height: 330px;
      overflow-y: auto;
    }

    .room-code-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 11px;
      border: 1px solid rgba(255, 230, 138, 0.25);
      background: rgba(0, 0, 0, 0.38);
      color: #fff;
      font-size: 13px;
      margin-bottom: 8px;
      outline: none;
    }

    .toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: linear-gradient(180deg, #193b29, #0d1f15);
      border: 1px solid var(--gold-mid);
      color: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      z-index: 80;
      opacity: 0;
      transition: all 0.24s ease;
      max-width: 92vw;
      text-align: center;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <div class="profile-box">
        <div class="avatar-ring">
          <img id="userAvatar" class="avatar-img" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23132b1e'/%3E%3Ccircle cx='50' cy='38' r='18' fill='%23f5b418'/%3E%3Cpath d='M20 88c4-18 18-26 30-26s26 8 30 26' fill='%2328b856'/%3E%3C/svg%3E" />
        </div>
        <div class="nick-badge" id="userNick">@Oyinchi</div>
        <div class="level-pill" id="userLevel">Lvl 1 · Yangi o'yinchi</div>
      </div>

      <div class="wallet-box">
        <div class="balance-readout">
          <span class="balance-amount" id="userBalance">8</span>
          <span class="coin-g">G</span>
        </div>
        <button class="deposit-btn" onclick="openMenuModal('deposit')">
          <span>G</span>
          <span>DEPOZIT</span>
          <span>&gt;</span>
        </button>
      </div>
    </header>

    <div class="center-status">
      <div class="zerex-crest">
        <span class="zerex-z">ZEREX</span>
        <span class="zerex-tagline">PLAY · WIN · EARN</span>
      </div>
      <div class="online-pill">
        <span class="online-dot"></span>
        <span id="onlineCount">403 online</span>
      </div>
    </div>

    <section class="side-menus-row">
      <div class="side-col left">
        <button class="wood-tile-btn" onclick="openMenuModal('tasks')">
          <div class="wood-box">📋</div>
          <span class="wood-label">VAZIFALAR</span>
        </button>
        <button class="wood-tile-btn" onclick="openMenuModal('rating')">
          <div class="wood-box">🏆</div>
          <span class="wood-label">REYTING</span>
        </button>
        <button class="wood-tile-btn" onclick="openMenuModal('shop')">
          <div class="wood-box">🏪</div>
          <span class="wood-label">DO‘KON</span>
        </button>
      </div>

      <div class="side-col right">
        <button class="wood-tile-btn" onclick="openFriendPlayModal()">
          <div class="wood-box">👥</div>
          <span class="wood-label">DO‘ST BILAN</span>
        </button>
        <button class="wood-tile-btn" onclick="openMenuModal('withdraw')">
          <div class="wood-box">💵</div>
          <span class="wood-label">PUL YECHISH</span>
        </button>
      </div>
    </section>

    <section class="games-section">
      <div class="games-strip" id="gamesStrip"></div>
    </section>

    <div class="play-wrap">
      <button class="play-btn" onclick="startInstantLiveGame(selectedGameId)">PLAY</button>
    </div>
    <p class="selected-game-hint">
      Tanlangan o‘yin: <strong id="selectedGameLabel">Shashka</strong> · Tikuv: <strong id="hintStake">3 G</strong> · Yutuq: <strong>1.8x</strong>
    </p>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" onclick="handleBackdropClick(event)">
    <div class="modal-card" id="modalCard">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <span id="modalIcon" style="font-size: 22px;">🎮</span>
          <h2 class="modal-title" id="modalTitle">Bo‘lim</h2>
        </div>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const MY_CARD_NUMBER = "6262 5702 3220 5437";
    const MY_CARD_OWNER = "Esirgapov Sherzod";

    const WIN_MULTIPLIER = 1.8;
    const MAX_STAKE = 100000;
    const STAKE_OPTIONS = [3, 5, 10, 20, 50, 100, 300, 1000, 5000, 10000, 50000, 100000];
    const FRIEND_INVITE_BONUS = 20;

    const MOVE_TIME_LIMIT = 50;
    const TOTAL_GAME_TIME = 390;

    const GAMES = [
      { id: "shashka", name: "Shashka", icon: "⚫", artClass: "art-shashka" },
      { id: "shaxmat", name: "Shaxmat", icon: "♞", artClass: "art-shaxmat" },
      { id: "bilyard", name: "Bilyard", icon: "🎱", artClass: "art-bilyard" },
      { id: "durak", name: "Durak", icon: "🃏", artClass: "art-durak" },
      { id: "mafia", name: "Mafia", icon: "🕵️", artClass: "art-mafia" },
      { id: "xo", name: "X-O", icon: "✖️", artClass: "art-xo" }
    ];

    function safeGetStorage(key, fallback) {
      try {
        const v = localStorage.getItem(key);
        return v === null ? fallback : v;
      } catch (e) {
        return fallback;
      }
    }

    function safeSetStorage(key, val) {
      try {
        localStorage.setItem(key, String(val));
      } catch (e) {}
    }

    let tg = null;
    let tgUser = null;
    try {
      tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
      if (tg) {
        tg.ready();
        tg.expand();
      }
      tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
    } catch (e) {}

    function getTelegramNick() {
      if (tgUser && tgUser.username) return "@" + tgUser.username;
      if (tgUser && tgUser.first_name) return tgUser.first_name;
      return "@Oyinchi";
    }

    function createInitialShashkaBoard() {
      const b = Array(64).fill(0);
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          if ((r + c) % 2 === 1) {
            if (r < 3) b[r * 8 + c] = 2;
            if (r > 4) b[r * 8 + c] = 1;
          }
        }
      }
      return b;
    }

    const state = {
      balance: Number(safeGetStorage("zerex_v9_balance", "8")) || 8,
      xp: Number(safeGetStorage("zerex_v9_xp", "0")) || 0,
      wins: Number(safeGetStorage("zerex_v9_wins", "0")) || 0,
      invitedFriends: Number(safeGetStorage("zerex_v9_friends", "0")) || 0,
      adsWatched: Number(safeGetStorage("zerex_v9_ads", "0")) || 0,
      sitesVisited: Number(safeGetStorage("zerex_v9_sites", "0")) || 0,
      bonusClaimed: safeGetStorage("zerex_v9_bonus", "0") === "1",
      selectedStake: 3,
      friendGameId: "shashka",
      friendStake: 3,
      lockedStake: 0,
      inGame: false,
      activeGameId: "shashka",
      opponentName: "Pokiza",
      opponentLvl: 13,
      totalSecondsLeft: TOTAL_GAME_TIME,
      moveSecondsLeft: MOVE_TIME_LIMIT,
      isMyTurn: true,
      micEnabled: false,
      myDrawAgree: false,
      opponentDrawAgree: true,
      shashkaBoard: createInitialShashkaBoard(),
      shashkaSelected: null,
      xoBoard: Array(9).fill(""),
      xoTurn: "X",
      payMethod: "Karta o‘tkazma",
      depositPackCoins: 1000,
      depositPackSom: 11000,
      ratingTab: "coins",
      onlineCount: 403
    };

    let selectedGameId = GAMES[0].id;
    let gameTimerInterval = null;

    function formatClock(sec) {
      const s = Math.max(0, sec);
      const m = Math.floor(s / 60);
      const r = s % 60;
      return m + ":" + (r < 10 ? "0" : "") + r;
    }

    function getLevelInfo(xp) {
      const level = Math.max(1, Math.floor(xp / 100) + 1);
      const titles = ["Yangi o'yinchi", "Tajribali", "Usta", "Grossmeyster", "Afsona"];
      return { level, title: titles[Math.min(titles.length - 1, Math.floor((level - 1) / 3))] };
    }

    function saveState() {
      safeSetStorage("zerex_v9_balance", state.balance);
      safeSetStorage("zerex_v9_xp", state.xp);
      safeSetStorage("zerex_v9_wins", state.wins);
      safeSetStorage("zerex_v9_friends", state.invitedFriends);
      safeSetStorage("zerex_v9_ads", state.adsWatched);
      safeSetStorage("zerex_v9_sites", state.sitesVisited);
      safeSetStorage("zerex_v9_bonus", state.bonusClaimed ? "1" : "0");
    }

    function showToast(text) {
      const el = document.getElementById("toast");
      if (!el) return;
      el.textContent = text;
      el.classList.add("show");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
    }

    function getAvatarDataUrl() {
      if (tgUser && tgUser.photo_url) return tgUser.photo_url;
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#132b1e"/><circle cx="50" cy="38" r="18" fill="#f5b418"/><path d="M20 88c4-18 18-26 30-26s26 8 30 26" fill="#28b856"/></svg>';
      return "data:image/svg+xml," + encodeURIComponent(svg);
    }

    function renderProfile() {
      const avatarEl = document.getElementById("userAvatar");
      if (avatarEl) avatarEl.src = getAvatarDataUrl();
      document.getElementById("userNick").textContent = getTelegramNick();
      const lvl = getLevelInfo(state.xp);
      document.getElementById("userLevel").textContent = "Lvl " + lvl.level + " · " + lvl.title;
      document.getElementById("userBalance").textContent = state.balance.toLocaleString("en-US");
      document.getElementById("onlineCount").textContent = state.onlineCount + " online";
      document.getElementById("hintStake").textContent = state.selectedStake.toLocaleString("en-US") + " G";
    }

    function renderGamesStrip() {
      const strip = document.getElementById("gamesStrip");
      if (!strip) return;
      strip.innerHTML = GAMES.map((g) => `
        <button class="game-chip ${g.id === selectedGameId ? "active" : ""}" onclick="startInstantLiveGame('${g.id}')">
          <div class="game-art ${g.artClass}">${g.icon}</div>
          <span class="game-name">${g.name}</span>
        </button>
      `).join("");
      const active = GAMES.find((g) => g.id === selectedGameId) || GAMES[0];
      document.getElementById("selectedGameLabel").textContent = active.name;
    }

    function stopGameTimers() {
      if (gameTimerInterval) {
        clearInterval(gameTimerInterval);
        gameTimerInterval = null;
      }
    }

    function startGameTimers() {
      stopGameTimers();
      gameTimerInterval = setInterval(() => {
        if (!state.inGame) {
          stopGameTimers();
          return;
        }
        state.totalSecondsLeft -= 1;
        state.moveSecondsLeft -= 1;

        if (state.moveSecondsLeft <= 0) {
          state.moveSecondsLeft = MOVE_TIME_LIMIT;
          state.isMyTurn = !state.isMyTurn;
          showToast(state.isMyTurn ? "Sizning navbatingiz (50s)" : "Raqib o‘ylamoqda...");
        }

        if (state.totalSecondsLeft <= 0) {
          showToast("6.5 daqiqalik o‘yin vaqti tugadi! Durrang.");
          finishGame(state.activeGameId, "draw");
          return;
        }

        const backdrop = document.getElementById("modalBackdrop");
        if (backdrop && backdrop.classList.contains("open") && state.inGame) {
          openActiveGameModal(state.activeGameId, true);
        }
      }, 1000);
    }

    function startInstantLiveGame(gameId) {
      selectedGameId = gameId;
      state.activeGameId = gameId;
      renderGamesStrip();

      if (!state.inGame) {
        if (state.balance < state.selectedStake) {
          showToast("Balansda yetarli tanga yo‘q! Depozit qiling.");
          openMenuModal("deposit");
          return;
        }
        const rivals = [
          { name: "Pokiza", lvl: 13 },
          { name: "Javohir", lvl: 18 },
          { name: "Sarob", lvl: 15 },
          { name: "Ozodbek", lvl: 21 }
        ];
        const pick = rivals[Math.floor(Math.random() * rivals.length)];
        state.balance -= state.selectedStake;
        state.lockedStake = state.selectedStake;
        state.inGame = true;
        state.opponentName = pick.name;
        state.opponentLvl = pick.lvl;
        state.totalSecondsLeft = TOTAL_GAME_TIME;
        state.moveSecondsLeft = MOVE_TIME_LIMIT;
        state.isMyTurn = true;
        state.myDrawAgree = false;
        state.opponentDrawAgree = true;
        state.shashkaBoard = createInitialShashkaBoard();
        state.shashkaSelected = null;
        state.xoBoard = Array(9).fill("");
        state.xoTurn = "X";
        saveState();
        renderProfile();
        startGameTimers();
        showToast("Jonli raqib: " + state.opponentName + " · 6:30 vaqt · 50s/yurish");
      }

      openActiveGameModal(gameId, false);
    }

    function getMandatoryCaptures(board, playerVal) {
      const enemyVal = playerVal === 1 ? 2 : 1;
      const dir = playerVal === 1 ? -1 : 1;
      const captures = [];
      for (let idx = 0; idx < 64; idx++) {
        if (board[idx] !== playerVal) continue;
        const r = Math.floor(idx / 8), c = idx % 8;
        for (const dr of [dir, -dir]) {
          for (const dc of [-1, 1]) {
            const mr = r + dr, mc = c + dc;
            const tr = r + dr * 2, tc = c + dc * 2;
            if (tr >= 0 && tr < 8 && tc >= 0 && tc < 8) {
              const midIdx = mr * 8 + mc;
              const toIdx = tr * 8 + tc;
              if (board[midIdx] === enemyVal && board[toIdx] === 0) {
                captures.push({ from: idx, mid: midIdx, to: toIdx });
              }
            }
          }
        }
      }
      return captures;
    }

    function tapShashkaSquare(idx) {
      if (!state.inGame) return;
      if (!state.isMyTurn) {
        showToast("Raqib o‘ylamoqda...");
        return;
      }

      const board = state.shashkaBoard;
      const mandatoryCaptures = getMandatoryCaptures(board, 1);

      if (state.shashkaSelected === null) {
        if (board[idx] === 1) {
          if (mandatoryCaptures.length > 0 && !mandatoryCaptures.some((m) => m.from === idx)) {
            showToast("Toshni yutib olish majburiy!");
            return;
          }
          state.shashkaSelected = idx;
          openActiveGameModal("shashka", true);
        } else {
          showToast("O‘zingizning donangizni tanlang");
        }
        return;
      }

      const from = state.shashkaSelected;
      if (from === idx) {
        state.shashkaSelected = null;
        openActiveGameModal("shashka", true);
        return;
      }

      const capMove = mandatoryCaptures.find((m) => m.from === from && m.to === idx);
      if (mandatoryCaptures.length > 0) {
        if (!capMove) {
          showToast("Majburiy yutish qoidasi: raqib toshini sakrab yutish shart!");
          return;
        }
        board[capMove.mid] = 0;
        board[capMove.to] = board[from];
        board[from] = 0;
        state.shashkaSelected = null;
        state.moveSecondsLeft = MOVE_TIME_LIMIT;
        state.isMyTurn = false;
        showToast("Tosh yutib olindi! Raqib o‘ylamoqda...");
        openActiveGameModal("shashka", true);
        return;
      }

      const r1 = Math.floor(from / 8), c1 = from % 8;
      const r2 = Math.floor(idx / 8), c2 = idx % 8;
      const dr = r2 - r1, dc = Math.abs(c2 - c1);

      if (board[idx] === 0 && dr === -1 && dc === 1) {
        board[idx] = board[from];
        board[from] = 0;
        state.shashkaSelected = null;
        state.moveSecondsLeft = MOVE_TIME_LIMIT;
        state.isMyTurn = false;
        openActiveGameModal("shashka", true);
      } else {
        showToast("Noto‘g‘ri yurish");
      }
    }

    function openModal(icon, title, bodyHtml) {
      document.getElementById("modalIcon").textContent = icon;
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalBody").innerHTML = bodyHtml;
      document.getElementById("modalBackdrop").classList.add("open");
    }

    function closeModal() {
      document.getElementById("modalBackdrop").classList.remove("open");
    }

    function handleBackdropClick(e) {
      if (e.target.id === "modalBackdrop") closeModal();
    }

    function openActiveGameModal(gameId, preserveScroll = false) {
      const card = document.getElementById("modalCard");
      const prevScroll = preserveScroll && card ? card.scrollTop : 0;

      const game = GAMES.find((g) => g.id === gameId) || GAMES[0];
      const stake = state.inGame ? state.lockedStake : state.selectedStake;
      const winPrize = Math.floor(stake * WIN_MULTIPLIER);
      const myLvl = getLevelInfo(state.xp).level;
      const myNick = getTelegramNick();

      const stakeRow = STAKE_OPTIONS.map((amt) => `
        <button class="stake-pill ${state.selectedStake === amt ? "active" : ""}" onclick="changeStakeInGame(${amt}, '${game.id}')">
          ${amt.toLocaleString("en-US")} G
        </button>
      `).join("");

      const mandatoryCaps = getMandatoryCaptures(state.shashkaBoard, 1);
      const turnBannerText = state.isMyTurn
        ? (mandatoryCaps.length > 0 ? "MAJBURIY YUTISH NAVBATI" : "SIZNING NAVBATINGIZ")
        : "RAQIB O‘YLAMOQDA...";

      let centerArenaHtml = "";
      if (game.id === "shashka") {
        const sqHtml = state.shashkaBoard.map((cell, idx) => {
          const r = Math.floor(idx / 8), c = idx % 8;
          const isDark = (r + c) % 2 === 1;
          const isSel = state.shashkaSelected === idx;
          const isCapTarget = state.shashkaSelected !== null && mandatoryCaps.some((m) => m.from === state.shashkaSelected && m.to === idx);
          const piece = cell === 2
            ? '<div class="checker-white"></div>'
            : cell === 1
            ? '<div class="checker-black"></div>'
            : "";
          return `
            <div class="sq-8x8 ${isDark ? "sq-dark" : "sq-light"} ${isSel ? "sq-selected" : ""} ${isCapTarget ? "sq-capture-hint" : ""}" onclick="tapShashkaSquare(${idx})">
              ${piece}
            </div>
          `;
        }).join("");

        centerArenaHtml = `
          <div class="wood-frame-board">
            <div class="board-8x8">${sqHtml}</div>
          </div>
          <div class="turn-status-pill ${!state.isMyTurn ? "thinking-pill" : ""}">
            ● ${turnBannerText}
          </div>
        `;
      } else if (game.id === "xo") {
        centerArenaHtml = `
          <div class="section-box">
            <div class="section-label">${state.isMyTurn ? "X-O · Navbat: " + state.xoTurn : "Raqib o‘ylamoqda..."}</div>
            <div class="xo-grid">
              ${state.xoBoard.map((v, i) => `<button class="xo-cell" onclick="if(!state.xoBoard[${i}]){state.xoBoard[${i}]=state.xoTurn;state.xoTurn=state.xoTurn==='X'?'O':'X';openActiveGameModal('xo',true);}">${v}</button>`).join("")}
            </div>
          </div>
        `;
      } else {
        centerArenaHtml = `
          <div class="section-box">
            <div class="section-label">${state.isMyTurn ? game.name + " Jonli Bellashuv" : "Raqib o‘ylamoqda..."}</div>
            <p style="font-size:12.5px;text-align:center;color:var(--text-secondary);">
              Raqib: <strong style="color:#fff;">${state.opponentName}</strong> · Tikuv: <strong style="color:var(--gold-bright);">${stake.toLocaleString("en-US")} G</strong> · Yutuq: <strong style="color:var(--gold-bright);">${winPrize.toLocaleString("en-US")} G</strong>
            </p>
          </div>
        `;
      }

      const oppSubLine = !state.isMyTurn
        ? `<span class="thinking-highlight">Raqib o‘ylamoqda...</span> · ⏱ ${state.moveSecondsLeft}s / yurish`
        : `⏱ ${state.moveSecondsLeft}s / yurish`;

      const bodyHtml = `
        <div class="section-box" style="padding:8px 10px;">
          <div class="stake-one-row">${stakeRow}</div>
        </div>

        <div class="prize-banner-top">
          <span>G‘OLIBGA +${winPrize.toLocaleString("en-US")}</span>
          <span class="coin-g" style="width:20px;height:20px;font-size:11px;">G</span>
        </div>

        <div class="player-strip-card ${!state.isMyTurn ? "active-turn-card" : ""}">
          <div class="player-left-info">
            <div class="player-mini-ava" style="background:linear-gradient(135deg,#6c63ff,#3b82f6);">PP</div>
            <div>
              <div class="player-name-line">
                <span>${state.opponentName}</span>
                <span class="lvl-tag">Lv ${state.opponentLvl}</span>
              </div>
              <div class="sub-timer-line">${oppSubLine}</div>
            </div>
          </div>
          <div class="clock-pill">${formatClock(state.totalSecondsLeft)}</div>
        </div>

        ${centerArenaHtml}

        <div class="player-strip-card ${state.isMyTurn ? "active-turn-card" : ""}">
          <div class="player-left-info">
            <img id="modalSelfAva" class="player-mini-ava" src="${getAvatarDataUrl()}" />
            <div>
              <div class="player-name-line">
                <span>${myNick}</span>
                <span class="lvl-tag">Lv ${myLvl}</span>
              </div>
              <div class="sub-timer-line">⏱ 0:${state.moveSecondsLeft < 10 ? "0" : ""}${state.moveSecondsLeft} / yurish</div>
            </div>
          </div>
          <div class="clock-pill">${formatClock(state.totalSecondsLeft)}</div>
        </div>

        <div class="gramora-bottom-actions">
          <button class="round-icon-btn ${state.micEnabled ? "active-mic" : ""}" onclick="toggleMicInGame('${game.id}')" title="Ovozli chat">
            ${state.micEnabled ? "🎙️" : "🎤"}
          </button>
          <button class="wood-action-pill ${state.myDrawAgree ? "voted" : ""}" onclick="requestTwoSideDraw('${game.id}')">
            ${state.myDrawAgree ? "Durrang (Kutilmoqda)" : "Durrang"}
          </button>
          <button class="wood-action-pill" onclick="finishGame('${game.id}', 'loss')">
            🏳️ Taslim
          </button>
        </div>

        ${state.inGame ? `
          <div class="outcome-row">
            <button class="outcome-btn outcome-win" onclick="finishGame('${game.id}', 'win')">G‘alaba (+${winPrize} G)</button>
            <button class="outcome-btn outcome-draw" onclick="requestTwoSideDraw('${game.id}')">Durrang Tasdiq</button>
            <button class="outcome-btn outcome-loss" onclick="finishGame('${game.id}', 'loss')">Yutqazish</button>
          </div>
        ` : `
          <button class="gold-cta-btn" onclick="startInstantLiveGame('${game.id}')">
            ⚡ Jonli raqib bilan boshlash (${stake.toLocaleString("en-US")} G)
          </button>
        `}
      `;

      openModal(game.icon, game.name, bodyHtml);
      if (preserveScroll && card) card.scrollTop = prevScroll;
    }

    function changeStakeInGame(amt, gameId) {
      if (amt > MAX_STAKE) return showToast("Maksimal tikuv 100 000 G!");
      state.selectedStake = amt;
      renderProfile();
      openActiveGameModal(gameId, true);
    }

    async function toggleMicInGame(gameId) {
      if (!state.micEnabled) {
        try {
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            stream.getTracks().forEach((t) => t.stop());
          }
        } catch (e) {}
        state.micEnabled = true;
        showToast("Ovozli chat yoqildi");
      } else {
        state.micEnabled = false;
        showToast("Ovozli chat o‘chirildi");
      }
      openActiveGameModal(gameId, true);
    }

    function requestTwoSideDraw(gameId) {
      if (!state.inGame) return;
      state.myDrawAgree = true;
      if (state.myDrawAgree && state.opponentDrawAgree) {
        showToast("Har ikki taraf durrangni tasdiqladi! Tikuv qaytarildi.");
        finishGame(gameId, "draw");
      } else {
        showToast("Durrang taklif qilindi...");
        openActiveGameModal(gameId, true);
      }
    }

    function finishGame(gameId, result) {
      if (!state.inGame) return;
      stopGameTimers();
      if (result === "win") {
        const prize = Math.floor(state.lockedStake * WIN_MULTIPLIER);
        state.balance += prize;
        state.wins += 1;
        state.xp += 35;
        showToast("G‘alaba! +" + prize.toLocaleString("en-US") + " G (1.8x)");
      } else if (result === "draw") {
        state.balance += state.lockedStake;
        state.xp += 10;
        showToast("Durrang! " + state.lockedStake.toLocaleString("en-US") + " G qaytarildi.");
      } else {
        state.xp += 5;
        showToast("O‘yin yakunlandi.");
      }
      state.inGame = false;
      state.lockedStake = 0;
      state.micEnabled = false;
      state.myDrawAgree = false;
      saveState();
      renderProfile();
      openActiveGameModal(gameId, false);
    }

    function renderDepositModalHtml() {
      const methods = ["Karta o‘tkazma", "Payme", "Click", "Uzum Bank", "Telegram Stars"];
      const packs = [
        { coins: 1000, som: 11000 },
        { coins: 2000, som: 22000 },
        { coins: 5000, som: 55000 },
        { coins: 10000, som: 110000 }
      ];

      return `
        <div class="deposit-amount-card">
          <div>
            <div style="font-size:20px;font-weight:950;color:#fff;">${state.depositPackSom.toLocaleString("uz-UZ")} <span style="font-size:12px;color:var(--text-secondary);">SO‘M</span></div>
            <div style="font-size:11.5px;color:var(--gold-bright);font-weight:800;">${state.depositPackCoins.toLocaleString("en-US")} G tanga</div>
          </div>
          <button class="copy-gold-btn" onclick="copyValue('${state.depositPackSom}', 'Summa nusxalandi')">📋 Nusxa</button>
        </div>

        <div class="stake-one-row" style="margin-bottom:10px;">
          ${packs.map((p) => `
            <button class="stake-pill ${state.depositPackCoins === p.coins ? "active" : ""}" onclick="state.depositPackCoins=${p.coins};state.depositPackSom=${p.som};openModal('💰','DEPOZIT',renderDepositModalHtml());">
              ${p.coins.toLocaleString("en-US")} G (${(p.som / 1000).toFixed(0)}k)
            </button>
          `).join("")}
        </div>

        <div class="section-box">
          <div class="section-label">KARTA RAQAMI</div>
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
            <div>
              <div style="font-size:15px;font-weight:900;letter-spacing:0.6px;color:#fff;">${MY_CARD_NUMBER}</div>
              <div style="font-size:12px;color:#d6c7a5;margin-top:2px;">${MY_CARD_OWNER}</div>
            </div>
            <button class="copy-gold-btn" onclick="copyValue('6262570232205437', 'Karta raqami nusxalandi')">📋 Nusxa</button>
          </div>
        </div>

        <div class="pay-methods-grid">
          ${methods.map((m) => `
            <button class="pay-method-btn ${state.payMethod === m ? "active" : ""}" onclick="state.payMethod='${m}';openModal('💰','DEPOZIT',renderDepositModalHtml());">${m}</button>
          `).join("")}
        </div>

        <div class="warn-amber-box">
          ⚠️ Kartaga aynan <strong>${state.depositPackSom.toLocaleString("uz-UZ")} so‘m</strong> yuboring.
          To‘lov tasdiqlangach <strong>2–3 soniya</strong> ichida tangalar tushadi.
        </div>

        <button class="gold-cta-btn" onclick="confirmDepositPayment()">
          ✅ To‘lovni tasdiqlash (${state.payMethod})
        </button>
        <button class="wood-action-pill" style="width:100%;margin-top:8px;" onclick="showToast('Chek yuborish oynasi ochildi')">
          🧾 Chek rasmini yuborish
        </button>
      `;
    }

    function copyValue(val, msg) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(val).catch(() => {});
      }
      showToast(msg);
    }

    function confirmDepositPayment() {
      const coins = state.depositPackCoins;
      const som = state.depositPackSom;
      showToast(state.payMethod + " orqali to‘lov tekshirilmoqda...");
      setTimeout(() => {
        state.balance += coins;
        state.xp += 30;
        saveState();
        renderProfile();
        showToast("✅ +" + coins.toLocaleString("en-US") + " G tushdi (" + som.toLocaleString("uz-UZ") + " so‘m)");
      }, 2500);
    }

    function openFriendPlayModal() {
      const payout = Math.floor(state.friendStake * WIN_MULTIPLIER);
      const gamesHtml = GAMES.map((g) => `
        <button class="game-chip ${g.id === state.friendGameId ? "active" : ""}" onclick="state.friendGameId='${g.id}';openFriendPlayModal();">
          <div class="game-art ${g.artClass}" style="width:40px;height:40px;font-size:19px;">${g.icon}</div>
          <span class="game-name" style="font-size:9px;">${g.name}</span>
        </button>
      `).join("");
      const stakesHtml = STAKE_OPTIONS.map((amt) => `
        <button class="stake-pill ${state.friendStake === amt ? "active" : ""}" onclick="state.friendStake=${amt};openFriendPlayModal();">
          ${amt.toLocaleString("en-US")} G
        </button>
      `).join("");

      openModal("👥", "DO‘ST BILAN O‘YNASH", `
        <div class="section-box">
          <div class="section-label">QAYSI O‘YIN?</div>
          <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px;">${gamesHtml}</div>
        </div>
        <div class="section-box">
          <div class="section-label">NECHTA TANGA TIKASIZ?</div>
          <div class="stake-one-row">${stakesHtml}</div>
        </div>
        <div class="section-box">
          <p style="font-size:12px;text-align:center;color:var(--text-secondary);margin-bottom:10px;">
            Do‘stingizga havola yuboring. Tikuv: <strong style="color:var(--gold-bright);">${state.friendStake.toLocaleString("en-US")} G</strong>,
            g‘olib <strong style="color:var(--gold-bright);">×1.8 (${payout.toLocaleString("en-US")} G)</strong> oladi.
          </p>
          <button class="gold-cta-btn" onclick="sendFriendInvite()">✈️ Telegram orqali do‘stga yuborish</button>
        </div>
      `);
    }

    function sendFriendInvite() {
      const url = "https://t.me/Zerex_uz_bot?start=play_" + state.friendGameId + "_" + state.friendStake;
      const text = "Zerex'da " + state.friendGameId.toUpperCase() + " o‘ynaymiz! Tikuv: " + state.friendStake + " G (1.8x).";
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink("https://t.me/share/url?url=" + encodeURIComponent(url) + "&text=" + encodeURIComponent(text));
      } else {
        copyValue(url, "Havola nusxalandi!");
      }
    }

    function renderTasksHtml() {
      return `
        <div class="task-card">
          <div class="task-left">
            <div class="task-icon-box">📺</div>
            <div>
              <div class="task-title">REKLAMA KO‘RISH</div>
              <div class="task-reward">+1 G · ${state.adsWatched}/20</div>
            </div>
          </div>
          <button class="task-action-btn" onclick="state.adsWatched++;state.balance+=1;saveState();renderProfile();openModal('📋','VAZIFALAR',renderTasksHtml());">BOSHLASH</button>
        </div>
        <div class="task-card">
          <div class="task-left">
            <div class="task-icon-box">🎁</div>
            <div>
              <div class="task-title">BONUS ДЛЯ НОВИЧКОВ БИРЖИ</div>
              <div class="task-reward">+1 G</div>
            </div>
          </div>
          <button class="task-action-btn" onclick="if(!state.bonusClaimed){state.bonusClaimed=true;state.balance+=1;saveState();renderProfile();showToast('+1 G');}else{showToast('Olindi');}">go</button>
        </div>
        <div class="task-card">
          <div class="task-left">
            <div class="task-icon-box">🔗</div>
            <div>
              <div class="task-title">SAYTGA O‘TISH</div>
              <div class="task-reward">+1 G · ${state.sitesVisited}/5</div>
            </div>
          </div>
          <button class="task-action-btn" onclick="state.sitesVisited++;state.balance+=1;saveState();renderProfile();openModal('📋','VAZIFALAR',renderTasksHtml());">BOSHLASH</button>
        </div>
        <div class="task-card">
          <div class="task-left">
            <div class="task-icon-box">👥</div>
            <div>
              <div class="task-title">DO‘ST TAKLIF QILISH</div>
              <div class="task-reward">+${FRIEND_INVITE_BONUS} G · har do‘st uchun (${state.invitedFriends} ta)</div>
            </div>
          </div>
          <button class="task-action-btn" onclick="state.invitedFriends++;state.balance+=FRIEND_INVITE_BONUS;saveState();renderProfile();openModal('📋','VAZIFALAR',renderTasksHtml());sendFriendInvite();">OCHISH</button>
        </div>
      `;
    }

    function renderRatingHtml() {
      const myNick = getTelegramNick();
      const myLvl = getLevelInfo(state.xp).level;
      const list = [{ name: myNick, wins: state.wins, coins: state.balance, level: myLvl, isMe: true }];
      for (let i = 1; i <= 105; i++) {
        list.push({
          name: "@Player_" + i,
          wins: Math.max(1, 110 - i),
          coins: Math.max(10, 12000 - i * 95),
          level: Math.max(1, 20 - Math.floor(i / 6))
        });
      }
      list.sort((a, b) => state.ratingTab === "wins" ? b.wins - a.wins : state.ratingTab === "level" ? b.level - a.level : b.coins - a.coins);
      const top100 = list.slice(0, 100);

      return `
        <div class="rating-tabs">
          <button class="rating-tab ${state.ratingTab === "wins" ? "active" : ""}" onclick="state.ratingTab='wins';openModal('🏆','REYTING',renderRatingHtml());">G‘ALABA</button>
          <button class="rating-tab ${state.ratingTab === "coins" ? "active" : ""}" onclick="state.ratingTab='coins';openModal('🏆','REYTING',renderRatingHtml());">TANGA</button>
          <button class="rating-tab ${state.ratingTab === "level" ? "active" : ""}" onclick="state.ratingTab='level';openModal('🏆','REYTING',renderRatingHtml());">DARAJA</button>
        </div>
        <div class="leaderboard-list">
          ${top100.map((p, i) => `
            <div class="leader-row" style="${p.isMe ? "border-color:#ffe68a;" : ""}">
              <div><strong>#${i + 1} ${p.name}</strong> ${p.isMe ? "(Siz)" : ""}</div>
              <strong style="color:var(--gold-bright);">
                ${state.ratingTab === "wins" ? p.wins + " g‘alaba" : state.ratingTab === "level" ? "Lvl " + p.level : p.coins.toLocaleString("en-US") + " G"}
              </strong>
            </div>
          `).join("")}
        </div>
      `;
    }

    function openMenuModal(type) {
      if (type === "tasks") return openModal("📋", "VAZIFALAR", renderTasksHtml());
      if (type === "deposit") return openModal("💰", "DEPOZIT", renderDepositModalHtml());
      if (type === "rating") return openModal("🏆", "REYTING", renderRatingHtml());
      if (type === "shop") {
        const items = [
          { name: "Oltin ramka", price: 50, icon: "👑" },
          { name: "Maxsus avatar nishoni", price: 80, icon: "⚡" },
          { name: "VIP stol effekti", price: 120, icon: "💎" }
        ];
        return openModal("🏪", "DO‘KON", items.map((it) => `
          <div class="leader-row">
            <div><strong>${it.icon} ${it.name}</strong></div>
            <button class="task-action-btn" onclick="if(state.balance>=${it.price}){state.balance-=${it.price};saveState();renderProfile();showToast('${it.name} olindi');}else{showToast('Mablag‘ yetarli emas');}">${it.price} G</button>
          </div>
        `).join(""));
      }
      if (type === "withdraw") {
        return openModal("💵", "PUL YECHISH", `
          <div class="section-box">
            <p style="font-size:12px;color:var(--text-secondary);margin-bottom:10px;">
              Balans: <strong style="color:var(--gold-bright);">${state.balance.toLocaleString("en-US")} G</strong> · Min: 1 000 G
            </p>
            <input id="wdAmt" class="room-code-input" type="number" placeholder="Miqdor (G)" />
            <input id="wdCard" class="room-code-input" placeholder="Karta raqami" />
            <button class="gold-cta-btn" onclick="const a=Number(document.getElementById('wdAmt').value||0);const c=(document.getElementById('wdCard').value||'').trim();if(a<1000||a>state.balance||!c)return showToast('Ma’lumotlarni tekshiring (min 1 000 G)');state.balance-=a;saveState();renderProfile();showToast(a+' G yechish so‘rovi yuborildi');closeModal();">So‘rov yuborish</button>
          </div>
        `);
      }
    }

    renderProfile();
    renderGamesStrip();
  </script>
</body>
</html>
