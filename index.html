<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zerex</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #1b130a 0%, #0d1d13 60%, #07100a 100%);
      color: #f7faf7;
      min-height: 100vh;
      padding: 14px;
    }
    .app { max-width: 460px; margin: 0 auto; }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
    .avatar {
      width: 66px; height: 66px; border-radius: 50%;
      background: linear-gradient(135deg, #ffe68a, #f5b418, #9b4dff);
      color: #102118; font-size: 28px; font-weight: bold;
      display: flex; align-items: center; justify-content: center; margin-bottom: 6px;
    }
    .pill {
      display: inline-block; background: rgba(15, 34, 24, 0.95);
      border: 1px solid rgba(255, 230, 138, 0.45);
      border-radius: 999px; padding: 4px 10px; font-size: 12px; color: #ffe68a; margin-bottom: 5px;
    }
    .sub {
      display: block; background: rgba(10, 22, 16, 0.9);
      border: 1px solid rgba(255, 230, 138, 0.25);
      border-radius: 10px; padding: 4px 9px; font-size: 12px; color: #dcebe2;
    }
    .right { text-align: right; }
    .bal {
      background: rgba(12, 28, 19, 0.95); border: 1px solid rgba(255, 230, 138, 0.45);
      border-radius: 14px; padding: 8px 14px; font-size: 22px; font-weight: bold;
      color: #ffe68a; margin-bottom: 8px;
    }
    .wood-btn {
      background: linear-gradient(180deg, #c88446 0%, #8e5222 60%, #532c0e 100%);
      border: 2px solid #f0be82; border-radius: 12px; color: #fff8e7;
      font-weight: bold; cursor: pointer; padding: 9px 12px; font-size: 12px;
    }
    .center { text-align: center; margin: 10px 0 16px; }
    .badge {
      display: inline-block; background: rgba(18, 38, 28, 0.92);
      border: 1px solid rgba(183, 128, 255, 0.5); border-radius: 999px;
      padding: 6px 14px; font-size: 12px; font-weight: bold; color: #e9d5ff; margin-bottom: 6px;
    }
    .online {
      display: inline-block; background: rgba(11, 27, 18, 0.92);
      border: 1px solid rgba(72, 229, 91, 0.5); border-radius: 999px;
      padding: 5px 12px; font-size: 12px; color: #d8ffe0;
    }
    .grid-menu { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
    .games {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      background: rgba(11, 24, 17, 0.88); border: 1px solid rgba(255, 230, 138, 0.25);
      border-radius: 14px; padding: 10px; margin-bottom: 14px;
    }
    .g-btn {
      background: rgba(25, 46, 34, 0.9); border: 1px solid rgba(255, 230, 138, 0.3);
      border-radius: 10px; padding: 9px 6px; color: #fff; font-size: 12px; font-weight: bold; cursor: pointer;
    }
    .g-btn.active { border-color: #ffe68a; background: rgba(142, 82, 34, 0.7); color: #ffe68a; }
    .play {
      width: 100%; padding: 15px; font-size: 22px; letter-spacing: 1px; color: #2c1504;
      background: linear-gradient(180deg, #ffd866 0%, #d48c48 55%, #8e5222 100%);
      border: 2px solid #f0be82; border-radius: 14px; font-weight: bold; cursor: pointer;
    }
    .hint { text-align: center; margin-top: 8px; font-size: 12px; color: #c9ddd0; }
    .box {
      display: none; margin-top: 14px; background: rgba(14, 26, 19, 0.97);
      border: 2px solid rgba(240, 190, 130, 0.5); border-radius: 14px; padding: 12px;
    }
    .box.open { display: block; }
    .box-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .box-title { font-size: 15px; font-weight: bold; color: #ffe68a; }
    .x-btn { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; padding: 4px 9px; cursor: pointer; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .act { background: rgba(255,230,138,0.16); border: 1px solid rgba(255,230,138,0.45); color: #ffe68a; border-radius: 10px; padding: 8px 11px; font-size: 12px; font-weight: bold; cursor: pointer; }
    p { font-size: 13px; line-height: 1.45; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div>
        <div class="avatar">Z</div>
        <div class="pill" id="nick">@Oyinchi</div>
        <span class="sub">Lvl 1 · Yangi o'yinchi</span>
      </div>
      <div class="right">
        <div class="bal" id="bal">8 G</div>
        <button class="wood-btn" onclick="openBox('deposit')">G DEPOZIT &gt;</button>
      </div>
    </div>

    <div class="center">
      <div class="badge">ZEREX · PLAY · WIN · EARN</div><br />
      <div class="online">● 403 online</div>
    </div>

    <div class="grid-menu">
      <button class="wood-btn" onclick="openBox('tasks')">📋 VAZIFALAR</button>
      <button class="wood-btn" onclick="openBox('rating')">🏆 REYTING</button>
      <button class="wood-btn" onclick="openBox('shop')">🏪 DO‘KON</button>
      <button class="wood-btn" onclick="openBox('friend')">👥 DO‘ST BILAN</button>
      <button class="wood-btn" onclick="openBox('withdraw')">💵 PUL YECHISH</button>
      <button class="wood-btn" onclick="openBox('rules')">📜 QOIDALAR</button>
    </div>

    <div class="games" id="games"></div>
    <button class="play" onclick="openBox('play')">PLAY</button>
    <div class="hint" id="hint">Tanlangan o‘yin: Shashka · Tikuv: 3 G · Yutuq: 1.8x</div>

    <div class="box" id="box">
      <div class="box-top">
        <div class="box-title" id="boxTitle">Bo‘lim</div>
        <button class="x-btn" onclick="closeBox()">Yopish</button>
      </div>
      <div id="boxBody"></div>
    </div>
  </div>

  <script>
    const list = [
      { id: "shashka", name: "⚫ Shashka" },
      { id: "shaxmat", name: "♞ Shaxmat" },
      { id: "bilyard", name: "🎱 Bilyard" },
      { id: "durak", name: "🃏 Durak" },
      { id: "mafia", name: "🕵️ Mafia" },
      { id: "xo", name: "✖️ X-O" }
    ];

    let cur = list[0];
    let coins = 8;
    let bet = 3;

    function refresh() {
      document.getElementById("bal").textContent = coins + " G";
      document.getElementById("hint").textContent =
        "Tanlangan o‘yin: " + cur.name.replace(/^[^\s]+\s/, "") + " · Tikuv: " + bet + " G · Yutuq: 1.8x";

      const wrap = document.getElementById("games");
      wrap.innerHTML = "";
      list.forEach(function (item) {
        const b = document.createElement("button");
        b.className = "g-btn" + (item.id === cur.id ? " active" : "");
        b.textContent = item.name;
        b.onclick = function () {
          cur = item;
          refresh();
          openBox("play");
        };
        wrap.appendChild(b);
      });
    }

    function openBox(type) {
      const box = document.getElementById("box");
      const title = document.getElementById("boxTitle");
      const body = document.getElementById("boxBody");
      box.classList.add("open");

      if (type === "play") {
        const win = Math.floor(bet * 1.8);
        title.textContent = cur.name;
        body.innerHTML =
          "<p>Tikuv: <b>" + bet + " G</b> · Yutuq: <b>" + win + " G (1.8x)</b></p>" +
          "<p>Umumiy vaqt: <b>6:30</b> · Yurish: <b>50s</b> · Raqib navbati: <b>Raqib o‘ylamoqda...</b></p>" +
          "<div class='row'>" +
          "<button class='act' onclick='setBet(3)'>3 G</button>" +
          "<button class='act' onclick='setBet(10)'>10 G</button>" +
          "<button class='act' onclick='finishMatch(\"win\")'>G‘alaba (+ " + win + " G)</button>" +
          "<button class='act' onclick='finishMatch(\"loss\")'>Yutqazish (-" + bet + " G)</button>" +
          "</div>";
        return;
      }

      if (type === "deposit") {
        title.textContent = "💰 DEPOZIT";
        body.innerHTML =
          "<p>Karta: <b>6262 5702 3220 5437</b> (Esirgapov Sherzod)</p>" +
          "<p>Paket: <b>1 000 G = 11 000 so‘m</b></p>" +
          "<div class='row'><button class='act' onclick='addCoins(1000)'>+1 000 G qo‘shish</button></div>";
        return;
      }

      if (type === "tasks") {
        title.textContent = "📋 VAZIFALAR";
        body.innerHTML =
          "<p>Reklama ko‘rib tanga oling:</p>" +
          "<div class='row'><button class='act' onclick='addCoins(1)'>+1 G olish</button></div>";
        return;
      }

      if (type === "rating") {
        title.textContent = "🏆 REYTING";
        body.innerHTML = "<p>1. @Oyinchi — " + coins + " G</p><p>2. Pokiza — 450 G</p><p>3. Javohir — 320 G</p>";
        return;
      }

      if (type === "shop") {
        title.textContent = "🏪 DO‘KON";
        body.innerHTML =
          "<p>Oltin ramka — 5 G</p>" +
          "<div class='row'><button class='act' onclick='spendCoins(5)'>Sotib olish (5 G)</button></div>";
        return;
      }

      if (type === "friend") {
        title.textContent = "👥 DO‘ST BILAN";
        body.innerHTML = "<p>Do‘stingiz bilan " + cur.name + " o‘ynash uchun tikuv: <b>" + bet + " G</b>.</p>";
        return;
      }

      if (type === "withdraw") {
        title.textContent = "💵 PUL YECHISH";
        body.innerHTML = "<p>Balans: <b>" + coins + " G</b> · Minimal yechish: <b>1 000 G</b>.</p>";
        return;
      }

      title.textContent = "📜 QOIDALAR";
      body.innerHTML = "<p>Shashkada toshni yutib olish majburiy. Har yurishga 50s, umumiy vaqt 6:30. Durrang ikki taraf roziligida.</p>";
    }

    function closeBox() {
      document.getElementById("box").classList.remove("open");
    }

    function setBet(v) {
      bet = v;
      refresh();
      openBox("play");
    }

    function addCoins(v) {
      coins += v;
      refresh();
    }

    function spendCoins(v) {
      if (coins < v) {
        alert("Balans yetarli emas.");
        return;
      }
      coins -= v;
      refresh();
    }

    function finishMatch(res) {
      if (coins < bet) {
        alert("Balans yetarli emas.");
        return;
      }
      if (res === "win") {
        coins = coins - bet + Math.floor(bet * 1.8);
      } else {
        coins = coins - bet;
      }
      refresh();
      openBox("play");
    }

    try {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        const u = window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user;
        if (u && u.username) {
          document.getElementById("nick").textContent = "@" + u.username;
        }
      }
    } catch (e) {}

    refresh();
  </script>
</body>
</html>
