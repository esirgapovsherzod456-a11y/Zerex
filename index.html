<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Zerex — Telegram Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-deep: #060d09;
      --forest-dark: #0b1c13;
      --forest-mid: #153524;
      --wood-top: #c88446;
      --wood-mid: #8e5222;
      --wood-bot: #532c0e;
      --gold-bright: #ffe68a;
      --gold-mid: #f5b418;
      --gold-dark: #a66900;
      --violet-glow: #9b4dff;
      --text-primary: #f7faf7;
      --text-secondary: #b9cdc0;
      --win-green: #28b856;
      --loss-red: #e04848;
      --draw-amber: #eab308;
      --radius-xl: 22px;
      --radius-lg: 16px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      color: var(--text-primary);
      background:
        radial-gradient(ellipse at 50% 20%, rgba(52, 211, 130, 0.16), transparent 48%),
        radial-gradient(ellipse at 82% 12%, rgba(155, 77, 255, 0.16), transparent 42%),
        radial-gradient(ellipse at 18% 82%, rgba(245, 180, 24, 0.14), transparent 48%),
        linear-gradient(180deg, #132e20 0%, #0b1c13 52%, #060d09 100%);
      overflow-x: hidden;
      padding-bottom: 28px;
    }

    .ambient-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .light-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(44px);
      opacity: 0.45;
    }

    .orb-1 {
      width: 260px;
      height: 260px;
      top: -70px;
      left: -60px;
      background: radial-gradient(circle, rgba(34, 150, 86, 0.65), transparent 72%);
    }

    .orb-2 {
      width: 280px;
      height: 280px;
      top: -60px;
      right: -70px;
      background: radial-gradient(circle, rgba(139, 69, 240, 0.42), transparent 72%);
    }

    .orb-3 {
      width: 340px;
      height: 240px;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(245, 180, 24, 0.22), transparent 72%);
    }

    .app {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 14px 20px;
    }

    /* Yuqori panel */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .profile-box {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      max-width: 170px;
    }

    .avatar-ring {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(145deg, var(--gold-bright), var(--gold-mid), var(--violet-glow));
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.65), 0 0 18px rgba(245, 180, 24, 0.35);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #102118;
      display: block;
    }

    .nick-badge {
      max-width: 165px;
      background: linear-gradient(90deg, rgba(16, 34, 24, 0.94), rgba(28, 18, 48, 0.92));
      border: 1px solid rgba(255, 230, 138, 0.45);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--gold-bright);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .level-pill {
      background: linear-gradient(180deg, rgba(18, 43, 30, 0.92), rgba(9, 22, 15, 0.96));
      border: 1px solid rgba(255, 230, 138, 0.32);
      border-radius: 10px;
      padding: 4px 9px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .wallet-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .balance-readout {
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(180deg, rgba(20, 46, 32, 0.9), rgba(8, 18, 12, 0.94));
      border: 1px solid rgba(255, 230, 138, 0.38);
      padding: 6px 12px;
      border-radius: 14px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.5);
    }

    .balance-amount {
      font-size: 25px;
      font-weight: 900;
      background: linear-gradient(180deg, #fff5bf, #f5b418);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .coin-g {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff4b8, #f5b418 58%, #9c5e00 100%);
      border: 2px solid #ffe99e;
      color: #462500;
      font-weight: 900;
      font-size: 15px;
      display: grid;
      place-items: center;
    }

    .deposit-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(180deg, #d68e49 0%, #965722 55%, #5c310e 100%);
      border: 2px solid #f0be82;
      border-radius: 13px;
      padding: 7px 14px;
      color: #fff8e6;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 5px 0 #3a1d06, 0 10px 18px rgba(0, 0, 0, 0.55);
    }

    /* 10. Markazda yashil nuqta bilan Online ko'rsatkichi */
    .center-status {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 8px;
      gap: 8px;
    }

    .zerex-crest {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(90deg, rgba(35, 18, 66, 0.9), rgba(17, 47, 32, 0.92), rgba(35, 18, 66, 0.9));
      border: 1px solid rgba(183, 128, 255, 0.55);
      padding: 5px 15px;
      border-radius: 999px;
    }

    .zerex-z {
      font-weight: 950;
      font-size: 15px;
      background: linear-gradient(180deg, #ffffff, #cfa6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .zerex-tagline {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.1px;
      color: var(--gold-bright);
    }

    .online-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(180deg, rgba(16, 42, 28, 0.92), rgba(8, 20, 14, 0.96));
      border: 1px solid rgba(72, 229, 91, 0.45);
      padding: 6px 15px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 800;
      color: #e8ffec;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
    }

    .online-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #2fe65b;
      box-shadow: 0 0 10px #2fe65b, 0 0 18px rgba(47, 230, 91, 0.65);
    }

    /* Yon menyular */
    .side-menus-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 14px;
      gap: 12px;
    }

    .side-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .side-col.right {
      align-items: flex-end;
    }

    .wood-tile-btn {
      width: 88px;
      background: transparent;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .wood-tile-btn:active {
      transform: scale(0.95);
    }

    .wood-box {
      width: 64px;
      height: 58px;
      border-radius: 14px;
      background: linear-gradient(180deg, var(--wood-top) 0%, var(--wood-mid) 56%, var(--wood-bot) 100%);
      border: 2px solid #f0be82;
      box-shadow: 0 5px 0 #361905, 0 10px 16px rgba(0, 0, 0, 0.55);
      display: grid;
      place-items: center;
      font-size: 26px;
      position: relative;
    }

    .wood-box::after {
      content: "";
      position: absolute;
      top: -4px;
      left: 6px;
      width: 18px;
      height: 8px;
      border-radius: 10px 10px 2px 10px;
      background: linear-gradient(180deg, #86e35b, #36942a);
      pointer-events: none;
    }

    .wood-label {
      font-size: 11px;
      font-weight: 800;
      text-align: center;
      line-height: 1.15;
      color: #fff7e3;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9);
    }

    /* O'yinlar qatori */
    .games-section {
      margin-top: 22px;
    }

    .games-strip {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    .game-chip {
      background: transparent;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    .game-chip.active {
      transform: translateY(-4px);
    }

    .game-art {
      width: 50px;
      height: 50px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      font-size: 24px;
      border: 2px solid rgba(255, 230, 138, 0.5);
      box-shadow: 0 5px 0 rgba(10, 20, 14, 0.95), 0 9px 16px rgba(0, 0, 0, 0.55);
    }

    .game-chip.active .game-art {
      border-color: var(--gold-bright);
      box-shadow: 0 0 0 2px rgba(245, 180, 24, 0.65), 0 0 16px rgba(245, 180, 24, 0.35);
    }

    .art-shashka { background: linear-gradient(145deg, #d98c46, #6d3810); }
    .art-shaxmat { background: linear-gradient(145deg, #5677a3, #1f2f45); }
    .art-bilyard { background: linear-gradient(145deg, #25a35f, #0b4a28); }
    .art-durak   { background: linear-gradient(145deg, #b83d59, #4f1421); }
    .art-mafia   { background: linear-gradient(145deg, #4b3578, #190f2e); }
    .art-xo      { background: linear-gradient(145deg, #743bc9, #28104d); }

    .game-name {
      font-size: 10.5px;
      font-weight: 800;
      color: #f5f9f6;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95);
    }

    .play-wrap {
      margin-top: 14px;
      display: flex;
      justify-content: center;
    }

    .play-btn {
      width: 82%;
      max-width: 310px;
      padding: 16px 24px;
      border-radius: 18px;
      border: 2px solid #f0be82;
      background: linear-gradient(180deg, #d48c48 0%, #945521 58%, #5b300e 100%);
      box-shadow: 0 7px 0 #341804, 0 14px 26px rgba(0, 0, 0, 0.65);
      color: #422006;
      font-size: 28px;
      font-weight: 950;
      letter-spacing: 2px;
      cursor: pointer;
    }

    .play-btn:active {
      transform: translateY(4px);
    }

    .selected-game-hint {
      text-align: center;
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .selected-game-hint strong {
      color: var(--gold-bright);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 7, 4, 0.84);
      backdrop-filter: blur(7px);
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 455px;
      max-height: 90vh;
      overflow-y: auto;
      background: linear-gradient(180deg, #173827 0%, #0d1f15 58%, #08130d 100%);
      border: 2px solid rgba(240, 190, 130, 0.55);
      border-radius: var(--radius-xl);
      padding: 16px;
      box-shadow: 0 20px 46px rgba(0, 0, 0, 0.85);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 230, 138, 0.16);
    }

    .modal-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 900;
      color: var(--gold-bright);
    }

    .close-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 17px;
      cursor: pointer;
    }

    .section-box {
      background: rgba(7, 17, 12, 0.82);
      border: 1px solid rgba(255, 230, 138, 0.14);
      border-radius: var(--radius-lg);
      padding: 12px;
      margin-bottom: 12px;
    }

    .section-label {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      text-align: center;
    }

    /* 7. Tikish tugmalari (3 dan 100,000 gacha) */
    .stake-scroll-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .stake-pill {
      padding: 8px 4px;
      border-radius: 12px;
      border: 1.5px solid rgba(240, 190, 130, 0.45);
      background: linear-gradient(180deg, #5e3717 0%, #341c09 100%);
      color: #fff3cf;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .stake-pill.active {
      background: linear-gradient(180deg, #ffe385 0%, #f5b418 65%, #b57400 100%);
      color: #261400;
      border-color: #fff5c2;
      box-shadow: 0 0 12px rgba(245, 180, 24, 0.4);
    }

    .friend-games-row {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .friend-send-btn {
      width: 100%;
      padding: 13px 14px;
      border-radius: 14px;
      border: 1.5px solid #ffe68a;
      background: linear-gradient(180deg, #ffd866 0%, #e5a115 65%, #b57704 100%);
      color: #2b1600;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 0 #694100;
    }

    /* 9. Vazifalar rasmdagi ko'rinishda */
    .task-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-radius: 15px;
      background: linear-gradient(180deg, #593314 0%, #381e0a 100%);
      border: 1.5px solid rgba(240, 190, 130, 0.35);
      margin-bottom: 10px;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .task-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 230, 138, 0.28);
      display: grid;
      place-items: center;
      font-size: 21px;
      flex-shrink: 0;
    }

    .task-title {
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      color: #fff6e0;
      letter-spacing: 0.3px;
    }

    .task-reward {
      font-size: 12px;
      font-weight: 800;
      color: var(--gold-bright);
      margin-top: 2px;
    }

    .task-sub {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .task-action-btn {
      padding: 9px 14px;
      border-radius: 12px;
      border: 1px solid #ffe68a;
      background: linear-gradient(180deg, #f7cb59 0%, #d99514 100%);
      color: #291500;
      font-weight: 900;
      font-size: 11.5px;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 3px 0 #664000;
    }

    /* 13. O'yin ichidagi boshqaruv (Taslim, Mikrofon, Durrang, 50x50) */
    .controls-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-top: 10px;
    }

    .ctrl-btn {
      padding: 9px 6px;
      border-radius: 11px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-weight: 800;
      font-size: 11.5px;
      cursor: pointer;
    }

    .ctrl-btn.mic-on {
      background: linear-gradient(180deg, #27a852, #156630);
      border-color: #7ef5a5;
    }

    .ctrl-btn.draw-voted {
      background: linear-gradient(180deg, #eab308, #a16207);
      color: #1c1200;
    }

    .ctrl-btn.surrender {
      background: linear-gradient(180deg, #d94343, #872020);
    }

    .outcome-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .outcome-btn {
      padding: 9px 6px;
      border-radius: 11px;
      border: none;
      font-weight: 800;
      font-size: 11.5px;
      cursor: pointer;
      color: #fff;
    }

    .outcome-win { background: linear-gradient(180deg, #27a852, #176b33); }
    .outcome-draw { background: linear-gradient(180deg, #eab308, #a16207); color: #1a1100; }
    .outcome-loss { background: linear-gradient(180deg, #d94343, #8c2323); }

    .xo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      max-width: 220px;
      margin: 8px auto;
    }

    .xo-cell {
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      border: 1px solid rgba(255, 230, 138, 0.4);
      background: rgba(255, 255, 255, 0.07);
      color: var(--gold-bright);
      font-size: 26px;
      font-weight: 900;
      cursor: pointer;
    }

    /* 12. To'lov usullari */
    .pay-methods-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .pay-method-btn {
      padding: 10px;
      border-radius: 12px;
      border: 1.5px solid rgba(255, 230, 138, 0.35);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      font-weight: 800;
      font-size: 12.5px;
      cursor: pointer;
    }

    .pay-method-btn.active {
      border-color: var(--gold-bright);
      background: rgba(245, 180, 24, 0.22);
      color: var(--gold-bright);
    }

    .card-box {
      background: rgba(255, 230, 138, 0.08);
      border: 1px dashed rgba(255, 230, 138, 0.45);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 12px;
    }

    .room-code-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 11px;
      border: 1px solid rgba(255, 230, 138, 0.25);
      background: rgba(0, 0, 0, 0.38);
      color: #fff;
      font-size: 13px;
      margin-bottom: 8px;
      outline: none;
    }

    .primary-action {
      width: 100%;
      padding: 12px 14px;
      border-radius: 13px;
      border: 1px solid #ffe68a;
      background: linear-gradient(180deg, #32b359 0%, #1b7837 100%);
      color: #fff;
      font-weight: 800;
      font-size: 13.5px;
      cursor: pointer;
    }

    .secondary-action {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
      margin-top: 8px;
    }

    .rating-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-bottom: 10px;
    }

    .rating-tab {
      padding: 8px 6px;
      border-radius: 11px;
      border: 1px solid rgba(240, 190, 130, 0.45);
      background: linear-gradient(180deg, #6e411b 0%, #3d220c 100%);
      color: #f3e5cf;
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
    }

    .rating-tab.active {
      background: linear-gradient(180deg, #ffe385 0%, #f5b418 65%, #b87704 100%);
      color: #2b1700;
    }

    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      max-height: 340px;
      overflow-y: auto;
    }

    .leader-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 10px;
      border-radius: 12px;
      background: rgba(16, 39, 27, 0.9);
      border: 1px solid rgba(255, 230, 138, 0.15);
      font-size: 13px;
    }

    .toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: linear-gradient(180deg, #193b29, #0d1f15);
      border: 1px solid var(--gold-mid);
      color: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      z-index: 80;
      opacity: 0;
      transition: all 0.24s ease;
      max-width: 92vw;
      text-align: center;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="ambient-layer">
    <div class="light-orb orb-1"></div>
    <div class="light-orb orb-2"></div>
    <div class="light-orb orb-3"></div>
  </div>

  <div class="app">
    <header class="top-bar">
      <div class="profile-box">
        <div class="avatar-ring">
          <img id="userAvatar" class="avatar-img" alt="Avatar" />
        </div>
        <div class="nick-badge" id="userNick">@Oyinchi</div>
        <div class="level-pill" id="userLevel">Lvl 1 · Yangi o'yinchi</div>
      </div>

      <div class="wallet-box">
        <div class="balance-readout">
          <span class="balance-amount" id="userBalance">8</span>
          <span class="coin-g">G</span>
        </div>
        <button class="deposit-btn" onclick="openMenuModal('deposit')">
          <span>G</span>
          <span>DEPOZIT</span>
          <span>&gt;</span>
        </button>
      </div>
    </header>

    <!-- 10. Markazda yashil nuqta bilan Online ko'rsatkichi -->
    <div class="center-status">
      <div class="zerex-crest">
        <span class="zerex-z">ZEREX</span>
        <span class="zerex-tagline">PLAY · WIN · EARN</span>
      </div>
      <div class="online-pill">
        <span class="online-dot"></span>
        <span id="onlineCount">403 online</span>
      </div>
    </div>

    <!-- Yon menyular -->
    <section class="side-menus-row">
      <div class="side-col left">
        <button class="wood-tile-btn" onclick="openMenuModal('tasks')">
          <div class="wood-box">📋</div>
          <span class="wood-label">VAZIFALAR</span>
        </button>

        <button class="wood-tile-btn" onclick="openMenuModal('rating')">
          <div class="wood-box">🏆</div>
          <span class="wood-label">REYTING</span>
        </button>

        <button class="wood-tile-btn" onclick="openMenuModal('shop')">
          <div class="wood-box">🏪</div>
          <span class="wood-label">DO‘KON</span>
        </button>
      </div>

      <div class="side-col right">
        <button class="wood-tile-btn" onclick="openFriendPlayModal()">
          <div class="wood-box">👥</div>
          <span class="wood-label">DO‘ST BILAN</span>
        </button>

        <button class="wood-tile-btn" onclick="openMenuModal('withdraw')">
          <div class="wood-box">💵</div>
          <span class="wood-label">PUL YECHISH</span>
        </button>
      </div>
    </section>

    <!-- O'yinlar qatori -->
    <section class="games-section">
      <div class="games-strip" id="gamesStrip"></div>
    </section>

    <div class="play-wrap">
      <button class="play-btn" onclick="openGameLobby(selectedGameId)">PLAY</button>
    </div>
    <p class="selected-game-hint">
      Tanlangan o‘yin: <strong id="selectedGameLabel">Shashka</strong> · Tikuv: <strong id="hintStake">3 G</strong> · Yutuq: <strong>1.8x</strong>
    </p>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="handleBackdropClick(event)">
    <div class="modal-card" id="modalCard">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <span id="modalIcon" style="font-size: 24px;">🎮</span>
          <h2 class="modal-title" id="modalTitle">Bo‘lim</h2>
        </div>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /**
     * KARTA RAQAMINGIZNI SHU YERGA KIRITING:
     */
    const OWNER_CARD_NUMBER = "8600 •••• •••• 4405";
    const OWNER_CARD_HOLDER = "ZEREX PAY";

    const WIN_MULTIPLIER = 1.8; // Yutgan o'yinchi 1.8x oladi
    const MAX_STAKE = 100000; // Maksimal 100 000 tanga
    const STAKE_OPTIONS = [3, 5, 10, 20, 50, 100, 300, 1000, 5000, 10000, 50000, 100000];

    const MIN_COINS_BUY = 1000;
    const MIN_COINS_PRICE_UZS = 11000;
    const FRIEND_INVITE_BONUS = 20; // Har bir taklif qilingan do'st uchun 20 tanga

    const GAMES = [
      { id: "shashka", name: "Shashka", icon: "⚫", artClass: "art-shashka", desc: "8x8 shashka. 50x50 (50 yurish) qoidasi bo‘yicha durrang, o‘zaro durrang kelishuvi, mikrofon va taslim bo‘lish mavjud." },
      { id: "shaxmat", name: "Shaxmat", icon: "♞", artClass: "art-shaxmat", desc: "Strategik shaxmat. Ikki tomonlama durrang kelishuvi, ovozli mikrofon va taslim bo‘lish imkoniyati bor." },
      { id: "bilyard", name: "Bilyard", icon: "🎱", artClass: "art-bilyard", desc: "8-shar bilyard. Raqib bilan mikrofon, ikki tomonlama durrang va taslim bo‘lish tugmalari mavjud." },
      { id: "durak", name: "Durak", icon: "🃏", artClass: "art-durak", desc: "Karta o‘yini. Durrang kelishuvi, mikrofon va taslim bo‘lish bilan jonli bellashuv." },
      { id: "mafia", name: "Mafia", icon: "🕵️", artClass: "art-mafia", desc: "Jamoaviy muhokama va ovozli mikrofon, durrang kelishuvi hamda taslim bo‘lish funksiyasi." },
      { id: "xo", name: "X-O", icon: "✖️", artClass: "art-xo", desc: "3x3 tezkor duel. Ketma-ket 3 ta belgi tering; durrangda tikuv qaytariladi." }
    ];

    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }
    const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;

    function getTelegramNick() {
      if (tgUser && tgUser.username) return `@${tgUser.username}`;
      if (tgUser && tgUser.first_name) return tgUser.first_name;
      return "@Zerex_Player";
    }

    const state = {
      balance: Number(localStorage.getItem("zerex_v3_balance") ?? 8), // Boshlang'ich 8 tanga
      xp: Number(localStorage.getItem("zerex_v3_xp") ?? 0),
      wins: Number(localStorage.getItem("zerex_v3_wins") ?? 0),
      invitedFriends: Number(localStorage.getItem("zerex_v3_friends") ?? 0),
      adsWatched: Number(localStorage.getItem("zerex_v3_ads") ?? 0),
      sitesVisited: Number(localStorage.getItem("zerex_v3_sites") ?? 0),
      bonusClaimed: localStorage.getItem("zerex_v3_bonus") === "1",
      selectedStake: 3,
      friendGameId: "shashka",
      friendStake: 3,
      roomCode: "",
      lockedStake: 0,
      matchStatus: "idle", // idle | matched
      micEnabled: false,
      myDrawAgree: false,
      opponentDrawAgree: true, // Raqib durrang taklif qilgan holatni sinash uchun
      shashkaMoves50: 0,
      xoBoard: Array(9).fill(""),
      xoTurn: "X",
      payMethod: "Payme",
      ratingTab: "coins",
      onlineCount: 403
    };

    let selectedGameId = GAMES[0].id;

    function getLevelInfo(xp) {
      const level = Math.max(1, Math.floor(xp / 100) + 1);
      const titles = ["Yangi o'yinchi", "Tajribali", "Usta", "Grossmeyster", "Afsona"];
      return { level, title: titles[Math.min(titles.length - 1, Math.floor((level - 1) / 3))] };
    }

    function saveState() {
      localStorage.setItem("zerex_v3_balance", String(state.balance));
      localStorage.setItem("zerex_v3_xp", String(state.xp));
      localStorage.setItem("zerex_v3_wins", String(state.wins));
      localStorage.setItem("zerex_v3_friends", String(state.invitedFriends));
      localStorage.setItem("zerex_v3_ads", String(state.adsWatched));
      localStorage.setItem("zerex_v3_sites", String(state.sitesVisited));
      localStorage.setItem("zerex_v3_bonus", state.bonusClaimed ? "1" : "0");
    }

    function showToast(text) {
      const el = document.getElementById("toast");
      el.textContent = text;
      el.classList.add("show");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
    }

    function renderProfile() {
      const avatarEl = document.getElementById("userAvatar");
      const fallbackSvg = encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
          <rect width="100" height="100" fill="#132b1e"/>
          <circle cx="50" cy="38" r="18" fill="#f5b418"/>
          <path d="M20 88c4-18 18-26 30-26s26 8 30 26" fill="#28b856"/>
        </svg>`
      );
      avatarEl.src = tgUser && tgUser.photo_url ? tgUser.photo_url : `data:image/svg+xml,${fallbackSvg}`;
      document.getElementById("userNick").textContent = getTelegramNick();
      const lvl = getLevelInfo(state.xp);
      document.getElementById("userLevel").textContent = `Lvl ${lvl.level} · ${lvl.title}`;
      document.getElementById("userBalance").textContent = state.balance.toLocaleString("en-US");
      document.getElementById("onlineCount").textContent = `${state.onlineCount} online`;
      document.getElementById("hintStake").textContent = `${state.selectedStake.toLocaleString("en-US")} G`;
    }

    function renderGamesStrip() {
      const strip = document.getElementById("gamesStrip");
      strip.innerHTML = GAMES.map((g) => `
        <button class="game-chip ${g.id === selectedGameId ? "active" : ""}" onclick="selectGame('${g.id}', true)">
          <div class="game-art ${g.artClass}">${g.icon}</div>
          <span class="game-name">${g.name}</span>
        </button>
      `).join("");
      const active = GAMES.find((g) => g.id === selectedGameId) || GAMES[0];
      document.getElementById("selectedGameLabel").textContent = active.name;
    }

    function selectGame(gameId, openImmediately = false) {
      selectedGameId = gameId;
      state.matchStatus = "idle";
      state.lockedStake = 0;
      state.myDrawAgree = false;
      renderGamesStrip();
      renderProfile();
      if (openImmediately) openGameLobby(gameId);
    }

    function openModal(icon, title, bodyHtml) {
      document.getElementById("modalIcon").textContent = icon;
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalBody").innerHTML = bodyHtml;
      document.getElementById("modalBackdrop").classList.add("open");
    }

    function closeModal() {
      document.getElementById("modalBackdrop").classList.remove("open");
    }

    function handleBackdropClick(e) {
      if (e.target.id === "modalBackdrop") closeModal();
    }

    /* 7 & 13. O'yin oynasi: 3..100,000 tikuv, 1.8x yutuq, durrang, mikrofon, taslim, 50x50 */
    function openGameLobby(gameId) {
      const game = GAMES.find((g) => g.id === gameId) || GAMES[0];
      const payoutWin = Math.floor(state.selectedStake * WIN_MULTIPLIER);

      const stakeButtons = STAKE_OPTIONS.map((amt) => `
        <button class="stake-pill ${state.selectedStake === amt ? "active" : ""}" onclick="setGameStake(${amt}, '${game.id}')">
          ${amt >= 1000 ? `${amt / 1000}K` : amt} G
        </button>
      `).join("");

      let activeRoomHtml = "";
      if (state.matchStatus === "matched") {
        const shashka50Btn = game.id === "shashka"
          ? `<button class="ctrl-btn" onclick="stepShashka50('${game.id}')">50x50 (${state.shashkaMoves50}/50)</button>`
          : `<button class="ctrl-btn" onclick="showToast('50x50 durrang qoidasi faqat Shashkada mavjud')">50x50 (Shashka)</button>`;

        activeRoomHtml = `
          <div class="live-banner">
            <span>🟢 Xona: <strong>${state.roomCode || "ZX-LIVE"}</strong> · Tikuv: <strong>${state.lockedStake.toLocaleString("en-US")} G</strong></span>
            <span>Yutuq: <strong>${Math.floor(state.lockedStake * WIN_MULTIPLIER).toLocaleString("en-US")} G</strong></span>
          </div>

          ${game.id === "xo" ? `
            <div class="section-box">
              <div class="section-label">X-O Maydon · Navbat: ${state.xoTurn}</div>
              <div class="xo-grid">
                ${state.xoBoard.map((v, i) => `<button class="xo-cell" onclick="playXoCell(${i})">${v}</button>`).join("")}
              </div>
            </div>
          ` : `
            <div class="section-box">
              <div class="section-label">${game.name} Jonli Xonasi</div>
              <p style="font-size:12px; color:var(--text-secondary);">
                Mikrofon holati: <strong>${state.micEnabled ? "Yoqilgan (Ovoz uzatilmoqda)" : "O‘chirilgan"}</strong> ·
                Durrang kelishuvi: <strong>${state.myDrawAgree && state.opponentDrawAgree ? "Ikkala tomon rozi (Durrang!)" : state.opponentDrawAgree ? "Raqib durrang taklif qildi" : "Kutilmoqda"}</strong>
              </p>
            </div>
          `}

          <div class="section-box">
            <div class="section-label">O‘yin ichidagi boshqaruv</div>
            <div class="controls-bar">
              <button class="ctrl-btn ${state.micEnabled ? "mic-on" : ""}" onclick="toggleMic('${game.id}')">
                ${state.micEnabled ? "🎙️ Mik: ON" : "🎤 Mikrofon"}
              </button>
              <button class="ctrl-btn ${state.myDrawAgree ? "draw-voted" : ""}" onclick="requestDraw('${game.id}')">
                🤝 Durrang
              </button>
              <button class="ctrl-btn surrender" onclick="surrenderMatch('${game.id}')">
                🏳️ Taslim bo‘lish
              </button>
            </div>
            <div style="margin-top:7px;">${shashka50Btn}</div>

            <div class="outcome-row">
              <button class="outcome-btn outcome-win" onclick="resolveMatch('${game.id}', 'win')">G‘alaba (${Math.floor(state.lockedStake * WIN_MULTIPLIER)} G)</button>
              <button class="outcome-btn outcome-draw" onclick="resolveMatch('${game.id}', 'draw')">Durrang (+${state.lockedStake} G)</button>
              <button class="outcome-btn outcome-loss" onclick="resolveMatch('${game.id}', 'loss')">Yutqazish</button>
            </div>
          </div>
        `;
      }

      const bodyHtml = `
        <div class="section-box">
          <p style="font-size:12.5px; line-height:1.45; color:#e7f3ec;">${game.desc}</p>
        </div>

        <div class="section-box">
          <div class="section-label">Nechta tanga tikasiz? (3 G — 100 000 G · 1.8x yutuq)</div>
          <div class="stake-scroll-grid">${stakeButtons}</div>
          <div style="margin-top:9px; font-size:12px; text-align:center; color:var(--gold-bright); font-weight:800;">
            Tanlangan tikuv: ${state.selectedStake.toLocaleString("en-US")} G → Yutuq: ${payoutWin.toLocaleString("en-US")} G (1.8x)
          </div>
        </div>

        ${activeRoomHtml}

        <div class="section-box">
          <button class="primary-action" onclick="startLiveMatch('${game.id}', state.selectedStake)">
            ⚡ Jonli raqib bilan boshlash (${state.selectedStake.toLocaleString("en-US")} G)
          </button>
          <input id="roomCodeInput" class="room-code-input" style="margin-top:9px;" placeholder="Xona kodini kiriting" value="${state.roomCode}" />
          <button class="secondary-action" onclick="joinRoomWithStake('${game.id}', state.selectedStake)">
            🔗 Xona kodi bilan ulanish
          </button>
        </div>
      `;

      openModal(game.icon, game.name, bodyHtml);
    }

    function setGameStake(amt, gameId) {
      if (amt > MAX_STAKE) {
        showToast("Maksimal tikuv 100 000 G!");
        return;
      }
      state.selectedStake = amt;
      renderProfile();
      openGameLobby(gameId);
    }

    function startLiveMatch(gameId, stakeAmt) {
      if (state.matchStatus === "matched") {
        showToast("Siz allaqachon xonadasiz!");
        return;
      }
      if (state.balance < stakeAmt) {
        showToast("Balansda yetarli tanga yo‘q! Depozit qiling.");
        return;
      }
      state.balance -= stakeAmt;
      state.lockedStake = stakeAmt;
      state.matchStatus = "matched";
      state.roomCode = state.roomCode || `ZX-${Math.floor(1000 + Math.random() * 9000)}`;
      state.myDrawAgree = false;
      state.opponentDrawAgree = true;
      state.shashkaMoves50 = 0;
      saveState();
      renderProfile();
      showToast(`${stakeAmt.toLocaleString("en-US")} G tikuv bilan xona ochildi`);
      openGameLobby(gameId);
    }

    function joinRoomWithStake(gameId, stakeAmt) {
      const code = (document.getElementById("roomCodeInput")?.value || "").trim().toUpperCase();
      if (!code) {
        showToast("Xona kodini kiriting!");
        return;
      }
      state.roomCode = code;
      startLiveMatch(gameId, stakeAmt);
    }

    async function toggleMic(gameId) {
      if (!state.micEnabled) {
        try {
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            stream.getTracks().forEach((t) => t.stop());
          }
          state.micEnabled = true;
          showToast("Mikrofon yoqildi (raqib bilan ovozli aloqa)");
        } catch (err) {
          state.micEnabled = true;
          showToast("Mikrofon rejimi yoqildi");
        }
      } else {
        state.micEnabled = false;
        showToast("Mikrofon o‘chirildi");
      }
      openGameLobby(gameId);
    }

    function requestDraw(gameId) {
      state.myDrawAgree = true;
      if (state.myDrawAgree && state.opponentDrawAgree) {
        showToast("Ikkala taraf ham durrangni tasdiqladi! Tikuv qaytariladi.");
        resolveMatch(gameId, "draw");
      } else {
        showToast("Durrang taklifi yuborildi. Raqib tasdiqlashini kuting.");
        openGameLobby(gameId);
      }
    }

    function stepShashka50(gameId) {
      state.shashkaMoves50 += 1;
      if (state.shashkaMoves50 >= 50) {
        showToast("50x50 qoidasi bajarildi! O‘yin durrang bilan tugadi.");
        resolveMatch(gameId, "draw");
      } else {
        showToast(`50x50 yurish: ${state.shashkaMoves50}/50`);
        openGameLobby(gameId);
      }
    }

    function surrenderMatch(gameId) {
      showToast("Siz taslim bo‘ldingiz. Tikuv raqibga o‘tdi.");
      resolveMatch(gameId, "loss");
    }

    function resolveMatch(gameId, outcome) {
      if (!state.lockedStake) return;
      if (outcome === "win") {
        const prize = Math.floor(state.lockedStake * WIN_MULTIPLIER);
        state.balance += prize;
        state.wins += 1;
        state.xp += 35;
        showToast(`G‘alaba! +${prize.toLocaleString("en-US")} G (1.8x) hisobingizga tushdi!`);
      } else if (outcome === "draw") {
        state.balance += state.lockedStake;
        state.xp += 10;
        showToast(`Durrang! ${state.lockedStake.toLocaleString("en-US")} G tikuv qaytarildi.`);
      } else {
        state.xp += 5;
        showToast(`Raund yakunlandi (${state.lockedStake.toLocaleString("en-US")} G tikuv).`);
      }
      state.lockedStake = 0;
      state.matchStatus = "idle";
      state.micEnabled = false;
      state.myDrawAgree = false;
      saveState();
      renderProfile();
      openGameLobby(gameId);
    }

    function playXoCell(idx) {
      if (state.xoBoard[idx]) return;
      state.xoBoard[idx] = state.xoTurn;
      state.xoTurn = state.xoTurn === "X" ? "O" : "X";
      openGameLobby("xo");
    }

    /* 11. Do'st bilan o'ynash oynasi (rasmdagi ko'rinishda) */
    function openFriendPlayModal() {
      const payout = Math.floor(state.friendStake * WIN_MULTIPLIER);
      const gamesRowHtml = GAMES.map((g) => `
        <button class="game-chip ${g.id === state.friendGameId ? "active" : ""}" onclick="setFriendGame('${g.id}')">
          <div class="game-art ${g.artClass}" style="width:42px;height:42px;font-size:20px;">${g.icon}</div>
          <span class="game-name" style="font-size:9.5px;">${g.name}</span>
        </button>
      `).join("");

      const stakesRowHtml = STAKE_OPTIONS.map((amt) => `
        <button class="stake-pill ${state.friendStake === amt ? "active" : ""}" onclick="setFriendStake(${amt})">
          ${amt >= 1000 ? `${amt / 1000}K` : amt} G
        </button>
      `).join("");

      const html = `
        <div class="section-box">
          <div class="section-label">QAYSI O‘YIN?</div>
          <div class="friend-games-row">${gamesRowHtml}</div>
        </div>

        <div class="section-box">
          <div class="section-label">NECHTA TANGA TIKASIZ?</div>
          <div class="stake-scroll-grid">${stakesRowHtml}</div>
        </div>

        <div class="section-box">
          <p style="font-size:12.5px; line-height:1.45; text-align:center; color:#e9f5ee; margin-bottom:12px;">
            Do‘stingizga havola yuboring — u havolani ochishi bilan o‘yin avtomatik boshlanadi.
            Tikuv: <strong style="color:var(--gold-bright);">${state.friendStake.toLocaleString("en-US")} G</strong>,
            g‘olib <strong style="color:var(--gold-bright);">×1.8 (${payout.toLocaleString("en-US")} G)</strong> oladi.
          </p>
          <button class="friend-send-btn" onclick="sendFriendInvite()">
            ✈️ Telegram orqali do‘stga yuborish
          </button>
        </div>
      `;
      openModal("👥", "DO‘ST BILAN O‘YNASH", html);
    }

    function setFriendGame(id) {
      state.friendGameId = id;
      openFriendPlayModal();
    }

    function setFriendStake(amt) {
      if (amt > MAX_STAKE) {
        showToast("Maksimal tikuv 100 000 G!");
        return;
      }
      state.friendStake = amt;
      openFriendPlayModal();
    }

    function sendFriendInvite() {
      const refCode = `ref_${tgUser ? tgUser.id : "user"}_${state.friendGameId}_${state.friendStake}`;
      const shareUrl = `https://t.me/Zerex_uz_bot?start=${refCode}`;
      const text = `Zerex'da ${state.friendGameId.toUpperCase()} o‘ynaymiz! Tikuv: ${state.friendStake} G (1.8x yutuq).`;
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(text)}`);
      } else {
        navigator.clipboard?.writeText(shareUrl);
        showToast("Do‘stga taklif havolasi nusxalandi!");
      }
    }

    /* 8 & 9. Vazifalar oynasi */
    function renderTasksHtml() {
      return `
        <div class="task-card">
          <div class="task-left">
            <div class="task-icon-box">📺</div>
            <div>
              <div class="task-title">REKLAMA KO‘RISH</div>
              <div class="task-reward">+1 G · ${state.adsWatched}/20</div>
              <div class="task-sub">Sarguzasht: ${Math.min(5, Math.floor(state.adsWatched / 4))}/5</div>
            </div>
          </div>
          <button class="task-action-btn" onclick="completeTaskAd()">BOSHLASH</button>
        </div>

        <div class="task-card">
          <div class="task-left">
            <div class="task-icon-box">🎁</div>
            <div>
              <div class="task-title">BONUS ДЛЯ НОВИЧКОВ БИРЖИ</div>
              <div class="task-reward">+1 G</div>
            </div>
          </div>
          <button class="task-action-btn" onclick="completeTaskBonus()">go</button>
        </div>

        <div class="task-card">
          <div class="task-left">
            <div class="task-icon-box">🔗</div>
            <div>
              <div class="task-title">SAYTGA O‘TISH</div>
              <div class="task-reward">+1 G · ${state.sitesVisited}/5</div>
              <div class="task-sub">Sarguzasht: ${Math.min(5, state.sitesVisited)}/5</div>
            </div>
          </div>
          <button class="task-action-btn" onclick="completeTaskSite()">BOSHLASH</button>
        </div>

        <div class="task-card">
          <div class="task-left">
            <div class="task-icon-box">👥</div>
            <div>
              <div class="task-title">DO‘ST TAKLIF QILISH</div>
              <div class="task-reward">+${FRIEND_INVITE_BONUS} G · har do‘st uchun (${state.invitedFriends} ta)</div>
            </div>
          </div>
          <button class="task-action-btn" onclick="completeFriendInviteTask()">OCHISH</button>
        </div>
      `;
    }

    function completeTaskAd() {
      state.adsWatched += 1;
      state.balance += 1;
      state.xp += 5;
      saveState();
      renderProfile();
      showToast("+1 G qo‘shildi!");
      openModal("📋", "VAZIFALAR", renderTasksHtml());
    }

    function completeTaskBonus() {
      if (state.bonusClaimed) {
        showToast("Bonus allaqachon olingan!");
        return;
      }
      state.bonusClaimed = true;
      state.balance += 1;
      state.xp += 10;
      saveState();
      renderProfile();
      showToast("+1 G bonus qo‘shildi!");
      openModal("📋", "VAZIFALAR", renderTasksHtml());
    }

    function completeTaskSite() {
      state.sitesVisited += 1;
      state.balance += 1;
      state.xp += 5;
      saveState();
      renderProfile();
      showToast("+1 G qo‘shildi!");
      openModal("📋", "VAZIFALAR", renderTasksHtml());
    }

    function completeFriendInviteTask() {
      state.invitedFriends += 1;
      state.balance += FRIEND_INVITE_BONUS;
      state.xp += 25;
      saveState();
      renderProfile();
      showToast(`Do‘st taklifi uchun +${FRIEND_INVITE_BONUS} G qo‘shildi!`);
      openModal("📋", "VAZIFALAR", renderTasksHtml());
      sendFriendInvite();
    }

    /* 12. Xarid tizimi: Karta + Payme, Click, Uzum Bank, Telegram Stars + 2-3 soniyada tushishi */
    function renderDepositHtml() {
      const methods = ["Payme", "Click", "Uzum Bank", "Telegram Stars"];
      const packs = [
        { coins: 1000, som: 11000, stars: 50 },
        { coins: 2000, som: 22000, stars: 100 },
        { coins: 5000, som: 55000, stars: 250 },
        { coins: 10000, som: 110000, stars: 500 }
      ];

      return `
        <div class="section-box">
          <div class="section-label">To‘lov usulini tanlang</div>
          <div class="pay-methods-grid">
            ${methods.map((m) => `
              <button class="pay-method-btn ${state.payMethod === m ? "active" : ""}" onclick="selectPayMethod('${m}')">${m}</button>
            `).join("")}
          </div>
          <div class="card-box">
            <div><strong>Karta raqami:</strong> ${OWNER_CARD_NUMBER} (${OWNER_CARD_HOLDER})</div>
            <div style="margin-top:4px; color:var(--text-secondary);">
              Usul: <strong>${state.payMethod}</strong> · To‘lovdan <strong>2–3 soniya</strong> ichida tangalar hisobga tushadi.
            </div>
          </div>
        </div>

        <div class="section-box">
          <div class="section-label">Paketlar (Minimal 1 000 G = 11 000 so‘m)</div>
          ${packs.map((p) => `
            <div class="leader-row" style="margin-bottom:8px;">
              <div>
                <div style="font-weight:900; color:var(--gold-bright);">${p.coins.toLocaleString("en-US")} G</div>
                <div style="font-size:11.5px; color:var(--text-secondary);">${p.som.toLocaleString("uz-UZ")} so‘m · ⭐ ${p.stars} Stars</div>
              </div>
              <button class="task-action-btn" onclick="processInstantPayment(${p.coins}, ${p.som})">To‘lash</button>
            </div>
          `).join("")}
        </div>
      `;
    }

    function selectPayMethod(method) {
      state.payMethod = method;
      openModal("💰", "DEPOZIT", renderDepositHtml());
    }

    function processInstantPayment(coins, som) {
      if (coins < MIN_COINS_BUY) {
        showToast("Minimal 1 000 tanga (11 000 so‘m)");
        return;
      }
      showToast(`${state.payMethod} orqali to‘lov tekshirilmoqda... (2–3 soniya)`);
      setTimeout(() => {
        state.balance += coins;
        state.xp += 30;
        saveState();
        renderProfile();
        showToast(`✅ ${coins.toLocaleString("en-US")} G hisobingizga tushdi (${som.toLocaleString("uz-UZ")} so‘m)`);
      }, 2500);
    }

    /* Reyting Top 100 */
    function buildTop100Players(tabKey) {
      const myNick = getTelegramNick();
      const myLvl = getLevelInfo(state.xp).level;
      const base = [
        { name: "@Abdulatipov", wins: 142, coins: 17066, level: 24 },
        { name: "@Javohir_UZ", wins: 131, coins: 16018, level: 22 },
        { name: "@Madiev_Pro", wins: 118, coins: 14146, level: 20 },
        { name: "@Ovchi_G", wins: 96, coins: 11188, level: 18 },
        { name: "@Mango_King", wins: 88, coins: 9957, level: 17 }
      ];
      const extra = [];
      for (let i = 6; i <= 105; i++) {
        extra.push({
          name: `@Player_${i}`,
          wins: Math.max(1, 85 - Math.floor(i * 0.6)),
          coins: Math.max(20, 9500 - i * 75),
          level: Math.max(2, 16 - Math.floor(i / 8))
        });
      }
      const all = [...base, ...extra, { name: myNick, wins: state.wins, coins: state.balance, level: myLvl, isMe: true }];
      all.sort((a, b) => tabKey === "wins" ? b.wins - a.wins : tabKey === "level" ? b.level - a.level : b.coins - a.coins);
      return all.slice(0, 100);
    }

    function renderRatingHtml() {
      const list = buildTop100Players(state.ratingTab);
      return `
        <div class="rating-tabs">
          <button class="rating-tab ${state.ratingTab === "wins" ? "active" : ""}" onclick="setRatingTab('wins')">G‘ALABA</button>
          <button class="rating-tab ${state.ratingTab === "coins" ? "active" : ""}" onclick="setRatingTab('coins')">TANGA</button>
          <button class="rating-tab ${state.ratingTab === "level" ? "active" : ""}" onclick="setRatingTab('level')">DARAJA</button>
        </div>
        <div class="leaderboard-list">
          ${list.map((p, i) => `
            <div class="leader-row" style="${p.isMe ? "border-color:#ffe68a;" : ""}">
              <div><strong>#${i + 1} ${p.name}</strong> ${p.isMe ? "(Siz)" : ""} <span style="font-size:11px;color:var(--text-secondary);">· Lvl ${p.level}</span></div>
              <strong style="color:var(--gold-bright);">
                ${state.ratingTab === "wins" ? `${p.wins} g‘alaba` : state.ratingTab === "level" ? `Lvl ${p.level}` : `${p.coins.toLocaleString("en-US")} G`}
              </strong>
            </div>
          `).join("")}
        </div>
      `;
    }

    function setRatingTab(tab) {
      state.ratingTab = tab;
      openModal("🏆", "REYTING", renderRatingHtml());
    }

    function openMenuModal(type) {
      if (type === "tasks") return openModal("📋", "VAZIFALAR", renderTasksHtml());
      if (type === "deposit") return openModal("💰", "DEPOZIT", renderDepositHtml());
      if (type === "rating") return openModal("🏆", "REYTING", renderRatingHtml());

      if (type === "shop") {
        const items = [
          { name: "Oltin ramka", price: 50, icon: "👑" },
          { name: "Maxsus avatar nishoni", price: 80, icon: "⚡" },
          { name: "VIP stol effekti", price: 120, icon: "💎" }
        ];
        return openModal("🏪", "DO‘KON", items.map((it) => `
          <div class="leader-row" style="margin-bottom:8px;">
            <div><strong>${it.icon} ${it.name}</strong></div>
            <button class="task-action-btn" onclick="buyItem('${it.name}', ${it.price})">${it.price} G</button>
          </div>
        `).join(""));
      }

      if (type === "withdraw") {
        return openModal("💵", "PUL YECHISH", `
          <div class="section-box">
            <p style="font-size:12px;color:var(--text-secondary);margin-bottom:10px;">
              Balans: <strong style="color:var(--gold-bright);">${state.balance.toLocaleString("en-US")} G</strong> · Minimal yechish: 1 000 G
            </p>
            <input id="wdAmt" class="room-code-input" type="number" placeholder="Miqdor (G)" />
            <input id="wdCard" class="room-code-input" placeholder="Karta raqami" />
            <button class="primary-action" onclick="submitWithdraw()">So‘rov yuborish</button>
          </div>
        `);
      }
    }

    function buyItem(name, price) {
      if (state.balance < price) return showToast("Mablag‘ yetarli emas!");
      state.balance -= price;
      state.xp += 20;
      saveState();
      renderProfile();
      showToast(`${name} xarid qilindi!`);
    }

    function submitWithdraw() {
      const amt = Number(document.getElementById("wdAmt")?.value || 0);
      const card = (document.getElementById("wdCard")?.value || "").trim();
      if (amt < 1000) return showToast("Minimal yechish 1 000 G!");
      if (amt > state.balance) return showToast("Balansda mablag‘ yetarli emas!");
      if (!card) return showToast("Karta raqamini kiriting!");
      state.balance -= amt;
      saveState();
      renderProfile();
      showToast(`${amt.toLocaleString("en-US")} G yechish so‘rovi yuborildi`);
      closeModal();
    }

    renderProfile();
    renderGamesStrip();
  </script>
</body>
</html>
