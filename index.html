<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Zerex — Telegram Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-image: url("https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=1200&q=80");
      --wood-top: #c88446;
      --wood-mid: #8e5222;
      --wood-bot: #532c0e;
      --gold-bright: #ffe68a;
      --gold-mid: #f5b418;
      --violet-glow: #9b4dff;
      --text-primary: #f7faf7;
      --text-secondary: #c9ddd0;
      --radius-xl: 22px;
      --radius-lg: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      color: var(--text-primary);
      background-image:
        linear-gradient(180deg, rgba(7, 22, 14, 0.78) 0%, rgba(8, 20, 14, 0.86) 55%, rgba(4, 11, 7, 0.95) 100%),
        var(--bg-image);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      overflow-x: hidden;
      padding-bottom: 28px;
    }

    .app {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 14px 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .profile-box {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      max-width: 170px;
    }

    .avatar-ring {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(145deg, var(--gold-bright), var(--gold-mid), var(--violet-glow));
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7), 0 0 16px rgba(245, 180, 24, 0.35);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #102118;
      display: block;
    }

    .nick-badge {
      max-width: 165px;
      background: rgba(11, 27, 19, 0.9);
      border: 1px solid rgba(255, 230, 138, 0.5);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--gold-bright);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .level-pill {
      background: rgba(9, 22, 15, 0.9);
      border: 1px solid rgba(255, 230, 138, 0.32);
      border-radius: 10px;
      padding: 4px 9px;
      font-size: 11.5px;
      font-weight: 700;
    }

    .wallet-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .balance-readout {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(10, 25, 17, 0.9);
      border: 1px solid rgba(255, 230, 138, 0.42);
      padding: 6px 12px;
      border-radius: 14px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.55);
    }

    .balance-amount {
      font-size: 25px;
      font-weight: 900;
      background: linear-gradient(180deg, #fff5bf, #f5b418);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .coin-g {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff4b8, #f5b418 58%, #9c5e00 100%);
      border: 2px solid #ffe99e;
      color: #462500;
      font-weight: 900;
      font-size: 15px;
      display: grid;
      place-items: center;
    }

    .deposit-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(180deg, #d68e49 0%, #965722 55%, #5c310e 100%);
      border: 2px solid #f0be82;
      border-radius: 13px;
      padding: 7px 14px;
      color: #fff8e6;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 5px 0 #3a1d06, 0 10px 18px rgba(0, 0, 0, 0.6);
    }

    .center-status {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 8px;
      gap: 8px;
    }

    .zerex-crest {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 34, 24, 0.88);
      border: 1px solid rgba(183, 128, 255, 0.55);
      padding: 5px 15px;
      border-radius: 999px;
    }

    .zerex-z {
      font-weight: 950;
      font-size: 15px;
      background: linear-gradient(180deg, #ffffff, #cfa6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .zerex-tagline {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.1px;
      color: var(--gold-bright);
    }

    .online-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(10, 26, 18, 0.92);
      border: 1px solid rgba(72, 229, 91, 0.5);
      padding: 6px 15px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 800;
      color: #e8ffec;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
    }

    .online-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #2fe65b;
      box-shadow: 0 0 10px #2fe65b, 0 0 18px rgba(47, 230, 91, 0.7);
    }

    .side-menus-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 14px;
      gap: 12px;
    }

    .side-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .side-col.right {
      align-items: flex-end;
    }

    .wood-tile-btn {
      width: 88px;
      background: transparent;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .wood-tile-btn:active {
      transform: scale(0.95);
    }

    .wood-box {
      width: 64px;
      height: 58px;
      border-radius: 14px;
      background: linear-gradient(180deg, var(--wood-top) 0%, var(--wood-mid) 56%, var(--wood-bot) 100%);
      border: 2px solid #f0be82;
      box-shadow: 0 5px 0 #361905, 0 10px 16px rgba(0, 0, 0, 0.65);
      display: grid;
      place-items: center;
      font-size: 26px;
      position: relative;
    }

    .wood-box::after {
      content: "";
      position: absolute;
      top: -4px;
      left: 6px;
      width: 18px;
      height: 8px;
      border-radius: 10px 10px 2px 10px;
      background: linear-gradient(180deg, #86e35b, #36942a);
      pointer-events: none;
    }

    .wood-label {
      font-size: 11px;
      font-weight: 800;
      text-align: center;
      line-height: 1.15;
      color: #fff7e3;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.95);
    }

    .games-section {
      margin-top: 22px;
    }

    .games-strip {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    .game-chip {
      background: transparent;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    .game-chip.active {
      transform: translateY(-4px);
    }

    .game-art {
      width: 50px;
      height: 50px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      font-size: 24px;
      border: 2px solid rgba(255, 230, 138, 0.5);
      box-shadow: 0 5px 0 rgba(10, 20, 14, 0.95), 0 9px 16px rgba(0, 0, 0, 0.6);
    }

    .game-chip.active .game-art {
      border-color: var(--gold-bright);
      box-shadow: 0 0 0 2px rgba(245, 180, 24, 0.65), 0 0 16px rgba(245, 180, 24, 0.35);
    }

    .art-shashka { background: linear-gradient(145deg, #d98c46, #6d3810); }
    .art-shaxmat { background: linear-gradient(145deg, #5677a3, #1f2f45); }
    .art-bilyard { background: linear-gradient(145deg, #25a35f, #0b4a28); }
    .art-durak   { background: linear-gradient(145deg, #b83d59, #4f1421); }
    .art-mafia   { background: linear-gradient(145deg, #4b3578, #190f2e); }
    .art-xo      { background: linear-gradient(145deg, #743bc9, #28104d); }

    .game-name {
      font-size: 10.5px;
      font-weight: 800;
      color: #f5f9f6;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95);
    }

    .play-wrap {
      margin-top: 14px;
      display: flex;
      justify-content: center;
    }

    .play-btn {
      width: 82%;
      max-width: 310px;
      padding: 16px 24px;
      border-radius: 18px;
      border: 2px solid #f0be82;
      background: linear-gradient(180deg, #d48c48 0%, #945521 58%, #5b300e 100%);
      box-shadow: 0 7px 0 #341804, 0 14px 26px rgba(0, 0, 0, 0.7);
      color: #422006;
      font-size: 28px;
      font-weight: 950;
      letter-spacing: 2px;
      cursor: pointer;
    }

    .play-btn:active {
      transform: translateY(4px);
    }

    .selected-game-hint {
      text-align: center;
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    .selected-game-hint strong {
      color: var(--gold-bright);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 7, 4, 0.85);
      backdrop-filter: blur(7px);
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 460px;
      max-height: 92vh;
      overflow-y: auto;
      background: linear-gradient(180deg, rgba(23, 56, 39, 0.96) 0%, rgba(13, 31, 21, 0.98) 58%, rgba(8, 19, 13, 0.99) 100%);
      border: 2px solid rgba(240, 190, 130, 0.55);
      border-radius: var(--radius-xl);
      padding: 15px;
      box-shadow: 0 20px 46px rgba(0, 0, 0, 0.88);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 230, 138, 0.16);
    }

    .modal-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 900;
      color: var(--gold-bright);
    }

    .close-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 17px;
      cursor: pointer;
    }

    .section-box {
      background: rgba(7, 17, 12, 0.84);
      border: 1px solid rgba(255, 230, 138, 0.15);
      border-radius: var(--radius-lg);
      padding: 11px;
      margin-bottom: 11px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .stake-one-row {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 7px;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }

    .stake-pill {
      flex: 0 0 auto;
      padding: 8px 12px;
      border-radius: 11px;
      border: 1.5px solid rgba(240, 190, 130, 0.45);
      background: linear-gradient(180deg, #5e3717 0%, #341c09 100%);
      color: #fff3cf;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .stake-pill.active {
      background: linear-gradient(180deg, #ffe385 0%, #f5b418 65%, #b57400 100%);
      color: #261400;
      border-color: #fff5c2;
    }

    .board-8x8 {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      width: 100%;
      max-width: 312px;
      aspect-ratio: 1 / 1;
      margin: 8px auto;
      border: 3px solid #c88446;
      border-radius: 10px;
      overflow: hidden;
    }

    .sq-8x8 {
      display: grid;
      place-items: center;
      aspect-ratio: 1 / 1;
      cursor: pointer;
      position: relative;
    }

    .sq-light { background: #edd1a3; }
    .sq-dark  { background: #6f4222; }
    .sq-selected { outline: 3px solid #38e8b0; outline-offset: -3px; }

    .piece-red {
      width: 74%;
      height: 74%;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff7b7b, #c92a2a);
      border: 2px solid #ffd8d8;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.55);
    }

    .piece-white {
      width: 74%;
      height: 74%;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #cbd5e1);
      border: 2px solid #475569;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.55);
    }

    .xo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      max-width: 220px;
      margin: 8px auto;
    }

    .xo-cell {
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      border: 1px solid rgba(255, 230, 138, 0.45);
      background: rgba(255, 255, 255, 0.08);
      color: var(--gold-bright);
      font-size: 26px;
      font-weight: 900;
      cursor: pointer;
    }

    .controls-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-top: 8px;
    }

    .ctrl-btn {
      padding: 9px 6px;
      border-radius: 11px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
    }

    .ctrl-btn.mic-on {
      background: linear-gradient(180deg, #27a852, #156630);
      border-color: #7ef5a5;
    }

    .ctrl-btn.draw-voted {
      background: linear-gradient(180deg, #eab308, #a16207);
      color: #1c1200;
    }

    .ctrl-btn.surrender {
      background: linear-gradient(180deg, #d94343, #872020);
    }

    .outcome-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-top: 8px;
    }

    .outcome-btn {
      padding: 8px 5px;
      border-radius: 10px;
      border: none;
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
      color: #fff;
    }

    .outcome-win { background: linear-gradient(180deg, #27a852, #176b33); }
    .outcome-draw { background: linear-gradient(180deg, #eab308, #a16207); color: #1a1100; }
    .outcome-loss { background: linear-gradient(180deg, #d94343, #8c2323); }

    .primary-action {
      width: 100%;
      padding: 12px 14px;
      border-radius: 13px;
      border: 1px solid #ffe68a;
      background: linear-gradient(180deg, #32b359 0%, #1b7837 100%);
      color: #fff;
      font-weight: 800;
      font-size: 13.5px;
      cursor: pointer;
    }

    .friend-games-row {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    .friend-send-btn {
      width: 100%;
      padding: 13px 14px;
      border-radius: 14px;
      border: 1.5px solid #ffe68a;
      background: linear-gradient(180deg, #ffd866 0%, #e5a115 65%, #b57704 100%);
      color: #2b1600;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
    }

    .task-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 11px;
      border-radius: 15px;
      background: linear-gradient(180deg, #593314 0%, #381e0a 100%);
      border: 1.5px solid rgba(240, 190, 130, 0.35);
      margin-bottom: 9px;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .task-icon-box {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.28);
      display: grid;
      place-items: center;
      font-size: 20px;
    }

    .task-title {
      font-size: 12.5px;
      font-weight: 900;
      color: #fff6e0;
    }

    .task-reward {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--gold-bright);
    }

    .task-action-btn {
      padding: 8px 12px;
      border-radius: 11px;
      border: 1px solid #ffe68a;
      background: linear-gradient(180deg, #f7cb59 0%, #d99514 100%);
      color: #291500;
      font-weight: 900;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }

    .pay-methods-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .pay-method-btn {
      padding: 9px;
      border-radius: 11px;
      border: 1.5px solid rgba(255, 230, 138, 0.35);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
    }

    .pay-method-btn.active {
      border-color: var(--gold-bright);
      background: rgba(245, 180, 24, 0.22);
      color: var(--gold-bright);
    }

    .card-box {
      background: rgba(255, 230, 138, 0.09);
      border: 1px dashed rgba(255, 230, 138, 0.5);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 12px;
    }

    .leader-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 10px;
      border-radius: 12px;
      background: rgba(16, 39, 27, 0.9);
      border: 1px solid rgba(255, 230, 138, 0.15);
      font-size: 13px;
      margin-bottom: 7px;
    }

    .rating-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-bottom: 10px;
    }

    .rating-tab {
      padding: 8px 6px;
      border-radius: 11px;
      border: 1px solid rgba(240, 190, 130, 0.45);
      background: linear-gradient(180deg, #6e411b 0%, #3d220c 100%);
      color: #f3e5cf;
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
    }

    .rating-tab.active {
      background: linear-gradient(180deg, #ffe385 0%, #f5b418 65%, #b87704 100%);
      color: #2b1700;
    }

    .leaderboard-list {
      max-height: 330px;
      overflow-y: auto;
    }

    .room-code-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 11px;
      border: 1px solid rgba(255, 230, 138, 0.25);
      background: rgba(0, 0, 0, 0.38);
      color: #fff;
      font-size: 13px;
      margin-bottom: 8px;
      outline: none;
    }

    .toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: linear-gradient(180deg, #193b29, #0d1f15);
      border: 1px solid var(--gold-mid);
      color: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      z-index: 80;
      opacity: 0;
      transition: all 0.24s ease;
      max-width: 92vw;
      text-align: center;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <div class="profile-box">
        <div class="avatar-ring">
          <img id="userAvatar" class="avatar-img" alt="Avatar" />
        </div>
        <div class="nick-badge" id="userNick">@Oyinchi</div>
        <div class="level-pill" id="userLevel">Lvl 1 · Yangi o'yinchi</div>
      </div>

      <div class="wallet-box">
        <div class="balance-readout">
          <span class="balance-amount" id="userBalance">8</span>
          <span class="coin-g">G</span>
        </div>
        <button class="deposit-btn" onclick="openMenuModal('deposit')">
          <span>G</span>
          <span>DEPOZIT</span>
          <span>&gt;</span>
        </button>
      </div>
    </header>

    <div class="center-status">
      <div class="zerex-crest">
        <span class="zerex-z">ZEREX</span>
        <span class="zerex-tagline">PLAY · WIN · EARN</span>
      </div>
      <div class="online-pill">
        <span class="online-dot"></span>
        <span id="onlineCount">403 online</span>
      </div>
    </div>

    <section class="side-menus-row">
      <div class="side-col left">
        <button class="wood-tile-btn" onclick="openMenuModal('tasks')">
          <div class="wood-box">📋</div>
          <span class="wood-label">VAZIFALAR</span>
        </button>
        <button class="wood-tile-btn" onclick="openMenuModal('rating')">
          <div class="wood-box">🏆</div>
          <span class="wood-label">REYTING</span>
        </button>
        <button class="wood-tile-btn" onclick="openMenuModal('shop')">
          <div class="wood-box">🏪</div>
          <span class="wood-label">DO‘KON</span>
        </button>
      </div>

      <div class="side-col right">
        <button class="wood-tile-btn" onclick="openFriendPlayModal()">
          <div class="wood-box">👥</div>
          <span class="wood-label">DO‘ST BILAN</span>
        </button>
        <button class="wood-tile-btn" onclick="openMenuModal('withdraw')">
          <div class="wood-box">💵</div>
          <span class="wood-label">PUL YECHISH</span>
        </button>

    <section class="games-section">
      <div class="games-strip" id="gamesStrip"></div>
    </section>

    <div class="play-wrap">
      <button class="play-btn" onclick="launchGameAuto(selectedGameId)">PLAY</button>
    </div>
    <p class="selected-game-hint">
      Tanlangan o‘yin: <strong id="selectedGameLabel">Shashka</strong> · Tikuv: <strong id="hintStake">3 G</strong> · Yutuq: <strong>1.8x</strong>
    </p>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" onclick="handleBackdropClick(event)">
    <div class="modal-card" id="modalCard">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <span id="modalIcon" style="font-size: 24px;">🎮</span>
          <h2 class="modal-title" id="modalTitle">Bo‘lim</h2>
        </div>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const MY_CARD_NUMBER = "6262 5702 3220 5437";
    const MY_CARD_OWNER = "Esirgapov Sherzod";

    const WIN_MULTIPLIER = 1.8;
    const MAX_STAKE = 100000;
    const STAKE_OPTIONS = [3, 5, 10, 20, 50, 100, 300, 1000, 5000, 10000, 50000, 100000];
    const MIN_COINS_BUY = 1000;
    const MIN_COINS_PRICE_UZS = 11000;
    const FRIEND_INVITE_BONUS = 20;

    const GAMES = [
      { id: "shashka", name: "Shashka", icon: "⚫", artClass: "art-shashka" },
      { id: "shaxmat", name: "Shaxmat", icon: "♞", artClass: "art-shaxmat" },
      { id: "bilyard", name: "Bilyard", icon: "🎱", artClass: "art-bilyard" },
      { id: "durak", name: "Durak", icon: "🃏", artClass: "art-durak" },
      { id: "mafia", name: "Mafia", icon: "🕵️", artClass: "art-mafia" },
      { id: "xo", name: "X-O", icon: "✖️", artClass: "art-xo" }
    ];

    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }
    const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;

    function getTelegramNick() {
      if (tgUser && tgUser.username) return `@${tgUser.username}`;
      if (tgUser && tgUser.first_name) return tgUser.first_name;
      return "@Zerex_Player";
    }

    function createInitialShashkaBoard() {
      const b = Array(64).fill(0);
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          if ((r + c) % 2 === 1) {
            if (r < 3) b[r * 8 + c] = 2;
            if (r > 4) b[r * 8 + c] = 1;
          }
        }
      }
      return b;
    }

    const state = {
      balance: Number(localStorage.getItem("zerex_v5_balance") ?? 8),
      xp: Number(localStorage.getItem("zerex_v5_xp") ?? 0),
      wins: Number(localStorage.getItem("zerex_v5_wins") ?? 0),
      invitedFriends: Number(localStorage.getItem("zerex_v5_friends") ?? 0),
      adsWatched: Number(localStorage.getItem("zerex_v5_ads") ?? 0),
      sitesVisited: Number(localStorage.getItem("zerex_v5_sites") ?? 0),
      bonusClaimed: localStorage.getItem("zerex_v5_bonus") === "1",
      selectedStake: 3,
      friendGameId: "shashka",
      friendStake: 3,
      lockedStake: 0,
      inGame: false,
      opponentName: "",
      micEnabled: false,
      myDrawAgree: false,
      opponentDrawAgree: true,
      shashkaMoves50: 0,
      shashkaBoard: createInitialShashkaBoard(),
      shashkaSelected: null,
      xoBoard: Array(9).fill(""),
      xoTurn: "X",
      payMethod: "Payme",
      ratingTab: "coins",
      onlineCount: 403
    };

    let selectedGameId = GAMES[0].id;

    function getLevelInfo(xp) {
      const level = Math.max(1, Math.floor(xp / 100) + 1);
      const titles = ["Yangi o'yinchi", "Tajribali", "Usta", "Grossmeyster", "Afsona"];
      return { level, title: titles[Math.min(titles.length - 1, Math.floor((level - 1) / 3))] };
    }

    function saveState() {
      localStorage.setItem("zerex_v5_balance", String(state.balance));
      localStorage.setItem("zerex_v5_xp", String(state.xp));
      localStorage.setItem("zerex_v5_wins", String(state.wins));
      localStorage.setItem("zerex_v5_friends", String(state.invitedFriends));
      localStorage.setItem("zerex_v5_ads", String(state.adsWatched));
      localStorage.setItem("zerex_v5_sites", String(state.sitesVisited));
      localStorage.setItem("zerex_v5_bonus", state.bonusClaimed ? "1" : "0");
    }

    function showToast(text) {
      const el = document.getElementById("toast");
      el.textContent = text;
      el.classList.add("show");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => el.classList.remove("show"), 2500);
    }

    function renderProfile() {
      const avatarEl = document.getElementById("userAvatar");
      const fallbackSvg = encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
          <rect width="100" height="100" fill="#132b1e"/>
          <circle cx="50" cy="38" r="18" fill="#f5b418"/>
          <path d="M20 88c4-18 18-26 30-26s26 8 30 26" fill="#28b856"/>
        </svg>`
      );
      avatarEl.src = tgUser && tgUser.photo_url ? tgUser.photo_url : `data:image/svg+xml,${fallbackSvg}`;
      document.getElementById("userNick").textContent = getTelegramNick();
      const lvl = getLevelInfo(state.xp);
      document.getElementById("userLevel").textContent = `Lvl ${lvl.level} · ${lvl.title}`;
      document.getElementById("userBalance").textContent = state.balance.toLocaleString("en-US");
      document.getElementById("onlineCount").textContent = `${state.onlineCount} online`;
      document.getElementById("hintStake").textContent = `${state.selectedStake.toLocaleString("en-US")} G`;
    }

    function renderGamesStrip() {
      const strip = document.getElementById("gamesStrip");
      strip.innerHTML = GAMES.map((g) => `
        <button class="game-chip ${g.id === selectedGameId ? "active" : ""}" onclick="selectAndPlayGame('${g.id}')">
          <div class="game-art ${g.artClass}">${g.icon}</div>
          <span class="game-name">${g.name}</span>
        </button>
      `).join("");
      const active = GAMES.find((g) => g.id === selectedGameId) || GAMES[0];
      document.getElementById("selectedGameLabel").textContent = active.name;
    }

    function selectAndPlayGame(gameId) {
      selectedGameId = gameId;
      renderGamesStrip();
      renderProfile();
      openGameScreen(gameId);
    }

    function launchGameAuto(gameId) {
      selectedGameId = gameId;
      renderGamesStrip();
      if (!state.inGame) {
        if (state.balance < state.selectedStake) {
          showToast("Balansda yetarli tanga yo‘q! Depozit qiling.");
          openMenuModal("deposit");
          return;
        }
        const rivals = ["@Javohir_UZ", "@Madiev_Pro", "@Sarob_X", "@Bekzod_77", "@Ozodbek"];
        state.balance -= state.selectedStake;
        state.lockedStake = state.selectedStake;
        state.inGame = true;
        state.opponentName = rivals[Math.floor(Math.random() * rivals.length)];
        state.shashkaBoard = createInitialShashkaBoard();
        state.shashkaSelected = null;
        state.shashkaMoves50 = 0;
        state.xoBoard = Array(9).fill("");
        state.xoTurn = "X";
        state.myDrawAgree = false;
        state.opponentDrawAgree = true;
        saveState();
        renderProfile();
        showToast(`Raqib topildi: ${state.opponentName} · Tikuv ${state.lockedStake.toLocaleString("en-US")} G`);
      }
      openGameScreen(gameId);
    }

    function openModal(icon, title, bodyHtml) {
      document.getElementById("modalIcon").textContent = icon;
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalBody").innerHTML = bodyHtml;
      document.getElementById("modalBackdrop").classList.add("open");
    }

    function closeModal() {
      document.getElementById("modalBackdrop").classList.remove("open");
    }

    function handleBackdropClick(e) {
      if (e.target.id === "modalBackdrop") closeModal();
    }

    function openGameScreen(gameId) {
      const game = GAMES.find((g) => g.id === gameId) || GAMES[0];
      const activeStake = state.inGame ? state.lockedStake : state.selectedStake;
      const winAmount = Math.floor(activeStake * WIN_MULTIPLIER);

      const stakeRowHtml = STAKE_OPTIONS.map((amt) => `
        <button class="stake-pill ${state.selectedStake === amt ? "active" : ""}" onclick="pickStakeOneRow(${amt}, '${game.id}')">
          ${amt.toLocaleString("en-US")} G
        </button>
      `).join("");

      let boardHtml = "";
      if (game.id === "shashka") {
        const squares = state.shashkaBoard.map((cell, idx) => {
          const r = Math.floor(idx / 8);
          const c = idx % 8;
          const isDark = (r + c) % 2 === 1;
          const selClass = state.shashkaSelected === idx ? "sq-selected" : "";
          const pieceHtml = cell === 1
            ? `<div class="piece-red"></div>`
            : cell === 2
            ? `<div class="piece-white"></div>`
            : "";
          return `
            <div class="sq-8x8 ${isDark ? "sq-dark" : "sq-light"} ${selClass}" onclick="tapShashkaSquare(${idx})">
              ${pieceHtml}
            </div>
          `;
        }).join("");
        boardHtml = `
          <div class="section-box">
            <div class="section-label">Shashka 8×8 · Donani bosing va bo‘sh katakka yuring</div>
            <div class="board-8x8">${squares}</div>
          </div>
        `;
      } else if (game.id === "xo") {
        boardHtml = `
          <div class="section-box">
            <div class="section-label">X-O 3×3 · Navbat: ${state.xoTurn}</div>
            <div class="xo-grid">
              ${state.xoBoard.map((val, i) => `<button class="xo-cell" onclick="tapXoSquare(${i})">${val}</button>`).join("")}
            </div>
          </div>
        `;
      } else {
        boardHtml = `
          <div class="section-box">
            <div class="section-label">${game.name} Jonli Maydoni</div>
            <p style="font-size:12.5px; color:var(--text-secondary); text-align:center; line-height:1.45;">
              Raqib: <strong style="color:#fff;">${state.opponentName || "Avto-raqib"}</strong> ·
              Tikuv: <strong style="color:var(--gold-bright);">${activeStake.toLocaleString("en-US")} G</strong> ·
              Yutuq: <strong style="color:var(--gold-bright);">${winAmount.toLocaleString("en-US")} G (1.8x)</strong>
            </p>
          </div>
        `;
      }

      const shashkaExtraBtn = game.id === "shashka"
        ? `<button class="ctrl-btn" onclick="stepShashka50('${game.id}')">50x50 (${state.shashkaMoves50}/50)</button>`
        : `<button class="ctrl-btn" onclick="showToast('50x50 faqat Shashkada mavjud')">50x50</button>`;

      const bodyHtml = `
        <div class="section-box">
          <div class="section-label">Tikuv (1 qatorda · 3 G – 100 000 G · 1.8x yutuq)</div>
          <div class="stake-one-row">${stakeRowHtml}</div>
          <div style="margin-top:8px; font-size:12px; text-align:center; color:var(--gold-bright); font-weight:800;">
            Tikuv: ${activeStake.toLocaleString("en-US")} G · Yutuq: ${winAmount.toLocaleString("en-US")} G (1.8x)
          </div>
        </div>

        ${boardHtml}

        <div class="section-box">
          <div class="section-label">Boshqaruv</div>
          <div class="controls-bar">
            <button class="ctrl-btn ${state.micEnabled ? "mic-on" : ""}" onclick="toggleMic('${game.id}')">
              ${state.micEnabled ? "🎙️ Mik: ON" : "🎤 Mikrofon"}
            </button>
            <button class="ctrl-btn ${state.myDrawAgree ? "draw-voted" : ""}" onclick="agreeDraw('${game.id}')">
              🤝 Durrang
            </button>
            <button class="ctrl-btn surrender" onclick="surrenderNow('${game.id}')">
              🏳️ Taslim bo‘lish
            </button>
          </div>
          <div style="margin-top:7px;">${shashkaExtraBtn}</div>

          ${state.inGame ? `
            <div class="outcome-row">
              <button class="outcome-btn outcome-win" onclick="finishRound('${game.id}', 'win')">G‘alaba (+${winAmount} G)</button>
              <button class="outcome-btn outcome-draw" onclick="finishRound('${game.id}', 'draw')">Durrang (+${activeStake} G)</button>
              <button class="outcome-btn outcome-loss" onclick="finishRound('${game.id}', 'loss')">Yutqazish</button>
            </div>
          ` : `
            <button class="primary-action" style="margin-top:9px;" onclick="launchGameAuto('${game.id}')">
              ⚡ Avto raqib topib o‘ynash (${state.selectedStake.toLocaleString("en-US")} G)
            </button>
          `}
        </div>
      `;

      openModal(game.icon, game.name, bodyHtml);
    }

    function pickStakeOneRow(amt, gameId) {
      if (amt > MAX_STAKE) return showToast("Maksimal tikuv 100 000 G!");
      state.selectedStake = amt;
      renderProfile();
      openGameScreen(gameId);
    }

    function tapShashkaSquare(idx) {
      if (!state.inGame) {
        launchGameAuto("shashka");
        return;
      }
      const board = state.shashkaBoard;
      if (state.shashkaSelected === null) {
        if (board[idx] === 1) {
          state.shashkaSelected = idx;
          openGameScreen("shashka");
        } else {
          showToast("O‘zingizning qizil shashkangizni tanlang");
        }
        return;
      }

      const from = state.shashkaSelected;
      state.shashkaSelected = null;
      if (from === idx) {
        openGameScreen("shashka");
        return;
      }

      const r1 = Math.floor(from / 8), c1 = from % 8;
      const r2 = Math.floor(idx / 8), c2 = idx % 8;
      const dr = r2 - r1, dc = Math.abs(c2 - c1);

      if (board[idx] === 0 && Math.abs(dr) === 1 && dc === 1) {
        board[idx] = board[from];
        board[from] = 0;
        state.shashkaMoves50 += 1;
        const oppIdx = board.findIndex((v, i) => v === 2 && i + 9 < 64 && board[i + 9] === 0 && ((i + 9) % 8) !== 0);
        if (oppIdx !== -1) {
          board[oppIdx + 9] = 2;
          board[oppIdx] = 0;
        }
      } else if (board[idx] === 0 && Math.abs(dr) === 2 && dc === 2) {
        const mid = (r1 + r2) / 2 * 8 + (c1 + c2) / 2;
        if (board[mid] === 2) {
          board[mid] = 0;
          board[idx] = board[from];
          board[from] = 0;
          state.shashkaMoves50 = 0;
        }
      } else {
        showToast("Diagonal bo‘sh katakka yuring");
      }
      openGameScreen("shashka");
    }

    function stepShashka50(gameId) {
      state.shashkaMoves50 += 1;
      if (state.shashkaMoves50 >= 50) {
        showToast("50x50 qoidasi bo‘yicha durrang!");
        finishRound(gameId, "draw");
      } else {
        showToast(`50x50 yurish: ${state.shashkaMoves50}/50`);
        openGameScreen(gameId);
      }
    }

    function tapXoSquare(idx) {
      if (!state.inGame) {
        launchGameAuto("xo");
        return;
      }
      if (state.xoBoard[idx]) return;
      state.xoBoard[idx] = state.xoTurn;
      state.xoTurn = state.xoTurn === "X" ? "O" : "X";
      openGameScreen("xo");
    }

    async function toggleMic(gameId) {
      if (!state.micEnabled) {
        try {
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            stream.getTracks().forEach((t) => t.stop());
          }
        } catch (e) {}
        state.micEnabled = true;
        showToast("Mikrofon yoqildi");
      } else {
        state.micEnabled = false;
        showToast("Mikrofon o‘chirildi");
      }
      openGameScreen(gameId);
    }

    function agreeDraw(gameId) {
      state.myDrawAgree = true;
      if (state.myDrawAgree && state.opponentDrawAgree) {
        showToast("Ikkala tomon durrangni tasdiqladi! Tikuv qaytarildi.");
        finishRound(gameId, "draw");
      } else {
        showToast("Durrang taklif qilindi");
        openGameScreen(gameId);
      }
    }

    function surrenderNow(gameId) {
      showToast("Siz taslim bo‘ldingiz.");
      finishRound(gameId, "loss");
    }

    function finishRound(gameId, outcome) {
      if (!state.inGame) return;
      if (outcome === "win") {
        const prize = Math.floor(state.lockedStake * WIN_MULTIPLIER);
        state.balance += prize;
        state.wins += 1;
        state.xp += 35;
        showToast(`G‘alaba! +${prize.toLocaleString("en-US")} G (1.8x)`);
      } else if (outcome === "draw") {
        state.balance += state.lockedStake;
        state.xp += 10;
        showToast(`Durrang! ${state.lockedStake.toLocaleString("en-US")} G qaytarildi.`);
      } else {
        state.xp += 5;
        showToast("O‘yin yakunlandi.");
      }
      state.inGame = false;
      state.lockedStake = 0;
      state.micEnabled = false;
      state.myDrawAgree = false;
      saveState();
      renderProfile();
      openGameScreen(gameId);
    }

    function openFriendPlayModal() {
      const payout = Math.floor(state.friendStake * WIN_MULTIPLIER);
      const gamesHtml = GAMES.map((g) => `
        <button class="game-chip ${g.id === state.friendGameId ? "active" : ""}" onclick="state.friendGameId='${g.id}';openFriendPlayModal();">
          <div class="game-art ${g.artClass}" style="width:40px;height:40px;font-size:19px;">${g.icon}</div>
          <span class="game-name" style="font-size:9px;">${g.name}</span>
        </button>
      `).join("");

      const stakesHtml = STAKE_OPTIONS.map((amt) => `
        <button class="stake-pill ${state.friendStake === amt ? "active" : ""}" onclick="state.friendStake=${amt};openFriendPlayModal();">
          ${amt.toLocaleString("en-US")} G
        </button>
      `).join("");

      openModal("👥", "DO‘ST BILAN O‘YNASH", `
        <div class="section-box">
          <div class="section-label">QAYSI O‘YIN?</div>
          <div class="friend-games-row">${gamesHtml}</div>
        </div>
        <div class="section-box">
          <div class="section-label">NECHTA TANGA TIKASIZ? (1 QATORDA)</div>
          <div class="stake-one-row">${stakesHtml}</div>
        </div>
        <div class="section-box">
          <p style="font-size:12px;text-align:center;color:var(--text-secondary);margin-bottom:10px;line-height:1.45;">
            Do‘stingizga havola yuboring — u havolani ochishi bilan o‘yin avtomatik boshlanadi.
            Tikuv: <strong style="color:var(--gold-bright);">${state.friendStake.toLocaleString("en-US")} G</strong>,
            g‘olib <strong style="color:var(--gold-bright);">×1.8 (${payout.toLocaleString("en-US")} G)</strong> oladi.
          </p>
          <button class="friend-send-btn" onclick="sendFriendInvite()">✈️ Telegram orqali do‘stga yuborish</button>
        </div>
      `);
    }

    function sendFriendInvite() {
      const url = `https://t.me/Zerex_uz_bot?start=play_${state.friendGameId}_${state.friendStake}`;
      const text = `Zerex'da ${state.friendGameId.toUpperCase()} o‘ynaymiz! Tikuv: ${state.friendStake} G (1.8x).`;
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`);
      } else {
        navigator.clipboard?.writeText(url);
        showToast("Taklif havolasi nusxalandi!");
      }
    }

    function renderTasksHtml() {
      return `
        <div class="task-card">
          <div class="task-left">
            <div class="task-icon-box">📺</div>
            <div>
              <div class="task-title">REKLAMA KO‘RISH</div>
              <div class="task-reward">+1 G · ${state.adsWatched}/20</div>
            </div>
          </div>
          <button class="task-action-btn" onclick="state.adsWatched++;state.balance+=1;saveState();renderProfile();openModal('📋','VAZIFALAR',renderTasksHtml());">BOSHLASH</button>
        </div>

        <div class="task-card">
          <div class="task-left">
            <div class="task-icon-box">🎁</div>
            <div>
              <div class="task-title">BONUS ДЛЯ НОВИЧКОВ БИРЖИ</div>
              <div class="task-reward">+1 G</div>
            </div>
          </div>
          <button class="task-action-btn" onclick="if(!state.bonusClaimed){state.bonusClaimed=true;state.balance+=1;saveState();renderProfile();showToast('+1 G');}else{showToast('Olindi');}">go</button>
        </div>

        <div class="task-card">
          <div class="task-left">
            <div class="task-icon-box">🔗</div>
            <div>
              <div class="task-title">SAYTGA O‘TISH</div>
              <div class="task-reward">+1 G · ${state.sitesVisited}/5</div>
            </div>
          </div>
          <button class="task-action-btn" onclick="state.sitesVisited++;state.balance+=1;saveState();renderProfile();openModal('📋','VAZIFALAR',renderTasksHtml());">BOSHLASH</button>
        </div>

        <div class="task-card">
          <div class="task-left">
            <div class="task-icon-box">👥</div>
            <div>
              <div class="task-title">DO‘ST TAKLIF QILISH</div>
              <div class="task-reward">+${FRIEND_INVITE_BONUS} G · har do‘st uchun (${state.invitedFriends} ta)</div>
            </div>
          </div>
          <button class="task-action-btn" onclick="state.invitedFriends++;state.balance+=FRIEND_INVITE_BONUS;saveState();renderProfile();openModal('📋','VAZIFALAR',renderTasksHtml());sendFriendInvite();">OCHISH</button>
        </div>
      `;
    }

    function renderDepositHtml() {
      const methods = ["Payme", "Click", "Uzum Bank", "Telegram Stars"];
      const packs = [
        { coins: 1000, som: 11000, stars: 50 },
        { coins: 2000, som: 22000, stars: 100 },
        { coins: 5000, som: 55000, stars: 250 },
        { coins: 10000, som: 110000, stars: 500 }
      ];
      return `
        <div class="section-box">
          <div class="section-label">To‘lov usuli</div>
          <div class="pay-methods-grid">
            ${methods.map((m) => `<button class="pay-method-btn ${state.payMethod === m ? "active" : ""}" onclick="state.payMethod='${m}';openModal('💰','DEPOZIT',renderDepositHtml());">${m}</button>`).join("")}
          </div>
          <div class="card-box">
            <div><strong>Karta:</strong> ${MY_CARD_NUMBER}</div>
            <div style="margin-top:2px;"><strong>Karta egasi:</strong> ${MY_CARD_OWNER}</div>
            <div style="margin-top:4px;color:var(--text-secondary);">Usul: <strong>${state.payMethod}</strong> · To‘lovdan 2–3 soniyada tushadi.</div>
          </div>
        </div>
        <div class="section-box">
          <div class="section-label">Paketlar (Min 1 000 G = 11 000 so‘m)</div>
          ${packs.map((p) => `
            <div class="leader-row">
              <div>
                <div style="font-weight:900;color:var(--gold-bright);">${p.coins.toLocaleString("en-US")} G</div>
                <div style="font-size:11.5px;color:var(--text-secondary);">${p.som.toLocaleString("uz-UZ")} so‘m · ⭐ ${p.stars} Stars</div>
              </div>
              <button class="task-action-btn" onclick="payPack(${p.coins}, ${p.som})">To‘lash</button>
            </div>
          `).join("")}
        </div>
      `;
    }

    function payPack(coins, som) {
      if (coins < MIN_COINS_BUY) return;
      showToast(`${state.payMethod} orqali to‘lov tasdiqlanmoqda (2–3 soniya)...`);
      setTimeout(() => {
        state.balance += coins;
        state.xp += 30;
        saveState();
        renderProfile();
        showToast(`✅ +${coins.toLocaleString("en-US")} G tushdi (${som.toLocaleString("uz-UZ")} so‘m)`);
      }, 2500);
    }

    function renderRatingHtml() {
      const myNick = getTelegramNick();
      const myLvl = getLevelInfo(state.xp).level;
      const list = [{ name: myNick, wins: state.wins, coins: state.balance, level: myLvl, isMe: true }];
      for (let i = 1; i <= 105; i++) {
        list.push({
          name: `@Player_${i}`,
          wins: Math.max(1, 110 - i),
          coins: Math.max(10, 12000 - i * 95),
          level: Math.max(1, 20 - Math.floor(i / 6))
        });
      }
      list.sort((a, b) => state.ratingTab === "wins" ? b.wins - a.wins : state.ratingTab === "level" ? b.level - a.level : b.coins - a.coins);
      const top100 = list.slice(0, 100);

      return `
        <div class="rating-tabs">
          <button class="rating-tab ${state.ratingTab === "wins" ? "active" : ""}" onclick="state.ratingTab='wins';openModal('🏆','REYTING',renderRatingHtml());">G‘ALABA</button>
          <button class="rating-tab ${state.ratingTab === "coins" ? "active" : ""}" onclick="state.ratingTab='coins';openModal('🏆','REYTING',renderRatingHtml());">TANGA</button>
          <button class="rating-tab ${state.ratingTab === "level" ? "active" : ""}" onclick="state.ratingTab='level';openModal('🏆','REYTING',renderRatingHtml());">DARAJA</button>
        </div>
        <div class="leaderboard-list">
          ${top100.map((p, i) => `
            <div class="leader-row" style="${p.isMe ? "border-color:#ffe68a;" : ""}">
              <div><strong>#${i + 1} ${p.name}</strong> ${p.isMe ? "(Siz)" : ""}</div>
              <strong style="color:var(--gold-bright);">
                ${state.ratingTab === "wins" ? `${p.wins} g‘alaba` : state.ratingTab === "level" ? `Lvl ${p.level}` : `${p.coins.toLocaleString("en-US")} G`}
              </strong>
            </div>
          `).join("")}
        </div>
      `;
    }

    function openMenuModal(type) {
      if (type === "tasks") return openModal("📋", "VAZIFALAR", renderTasksHtml());
      if (type === "deposit") return openModal("💰", "DEPOZIT", renderDepositHtml());
      if (type === "rating") return openModal("🏆", "REYTING", renderRatingHtml());
      if (type === "shop") {
        const items = [
          { name: "Oltin ramka", price: 50, icon: "👑" },
          { name: "Maxsus avatar nishoni", price: 80, icon: "⚡" },
          { name: "VIP stol effekti", price: 120, icon: "💎" }
        ];
        return openModal("🏪", "DO‘KON", items.map((it) => `
          <div class="leader-row">
            <div><strong>${it.icon} ${it.name}</strong></div>
            <button class="task-action-btn" onclick="if(state.balance>=${it.price}){state.balance-=${it.price};saveState();renderProfile();showToast('${it.name} olindi');}else{showToast('Mablag‘ yetarli emas');}">${it.price} G</button>
          </div>
        `).join(""));
      }
      if (type === "withdraw") {
        return openModal("💵", "PUL YECHISH", `
          <div class="section-box">
            <p style="font-size:12px;color:var(--text-secondary);margin-bottom:10px;">
              Balans: <strong style="color:var(--gold-bright);">${state.balance.toLocaleString("en-US")} G</strong> · Min: 1 000 G
            </p>
            <input id="wdAmt" class="room-code-input" type="number" placeholder="Miqdor (G)" />
            <input id="wdCard" class="room-code-input" placeholder="Karta raqami" />
            <button class="primary-action" onclick="const a=Number(document.getElementById('wdAmt').value||0);const c=(document.getElementById('wdCard').value||'').trim();if(a<1000||a>state.balance||!c)return showToast('Ma’lumotlarni tekshiring (min 1 000 G)');state.balance-=a;saveState();renderProfile();showToast(a+' G yechish so‘rovi yuborildi');closeModal();">So‘rov yuborish</button>
          </div>
        `);
      }
    }

    renderProfile();
    renderGamesStrip();
  </script>
</body>
</html>
