<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zerex</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #1b140b 0%, #0d1d14 55%, #07100b 100%);
      color: #f7faf7;
      min-height: 100vh;
      padding: 14px;
    }

    .wrap {
      max-width: 460px;
      margin: 0 auto;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 14px;
    }

    .avatar {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffe68a, #f5b418, #9b4dff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #102118;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .tag {
      display: inline-block;
      background: rgba(15, 34, 24, 0.95);
      border: 1px solid rgba(255, 230, 138, 0.45);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
      color: #ffe68a;
      margin-bottom: 5px;
    }

    .sub-tag {
      display: block;
      background: rgba(10, 22, 16, 0.9);
      border: 1px solid rgba(255, 230, 138, 0.25);
      border-radius: 10px;
      padding: 4px 9px;
      font-size: 12px;
      color: #dcebe2;
    }

    .wallet {
      text-align: right;
    }

    .bal-box {
      background: rgba(12, 28, 19, 0.95);
      border: 1px solid rgba(255, 230, 138, 0.45);
      border-radius: 14px;
      padding: 8px 14px;
      font-size: 22px;
      font-weight: 900;
      color: #ffe68a;
      margin-bottom: 8px;
    }

    .btn-wood {
      background: linear-gradient(180deg, #c88446 0%, #8e5222 60%, #532c0e 100%);
      border: 2px solid #f0be82;
      border-radius: 14px;
      color: #fff8e7;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 #361905;
    }

    .btn-wood:active {
      transform: translateY(2px);
    }

    .dep-btn {
      padding: 8px 14px;
      font-size: 13px;
    }

    .center-info {
      text-align: center;
      margin: 10px 0 18px;
    }

    .brand {
      display: inline-block;
      background: rgba(18, 38, 28, 0.92);
      border: 1px solid rgba(183, 128, 255, 0.5);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 800;
      color: #e9d5ff;
      margin-bottom: 8px;
    }

    .online {
      display: inline-block;
      background: rgba(11, 27, 18, 0.92);
      border: 1px solid rgba(72, 229, 91, 0.5);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 700;
      color: #d8ffe0;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .menu-btn {
      padding: 13px 10px;
      font-size: 13px;
    }

    .games-box {
      background: rgba(11, 24, 17, 0.88);
      border: 1px solid rgba(255, 230, 138, 0.25);
      border-radius: 16px;
      padding: 10px;
      margin-bottom: 16px;
    }

    .games-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .game-btn {
      background: rgba(25, 46, 34, 0.9);
      border: 1px solid rgba(255, 230, 138, 0.3);
      border-radius: 12px;
      padding: 10px 6px;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .game-btn.active {
      border-color: #ffe68a;
      background: rgba(142, 82, 34, 0.65);
      color: #ffe68a;
    }

    .play-btn {
      width: 100%;
      padding: 16px;
      font-size: 24px;
      letter-spacing: 1.5px;
      color: #2c1504;
      background: linear-gradient(180deg, #ffd866 0%, #d48c48 55%, #8e5222 100%);
    }

    .hint {
      text-align: center;
      margin-top: 8px;
      font-size: 12px;
      color: #c9ddd0;
    }

    .panel {
      display: none;
      margin-top: 16px;
      background: rgba(14, 26, 19, 0.97);
      border: 2px solid rgba(240, 190, 130, 0.5);
      border-radius: 18px;
      padding: 14px;
    }

    .panel.show {
      display: block;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .panel-title {
      font-size: 16px;
      font-weight: 800;
      color: #ffe68a;
    }

    .close-x {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      border-radius: 8px;
      padding: 4px 10px;
      cursor: pointer;
    }

    .panel-body {
      font-size: 13px;
      line-height: 1.5;
      color: #e8f3ec;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .small-btn {
      background: rgba(255, 230, 138, 0.15);
      border: 1px solid rgba(255, 230, 138, 0.45);
      color: #ffe68a;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <div class="avatar">Z</div>
        <div class="tag" id="nickText">@Oyinchi</div>
        <span class="sub-tag" id="lvlText">Lvl 1 · Yangi o'yinchi</span>
      </div>

      <div class="wallet">
        <div class="bal-box" id="balText">8 G</div>
        <button class="btn-wood dep-btn" onclick="openPanel('deposit')">G DEPOZIT &gt;</button>
      </div>
    </div>

    <div class="center-info">
      <div class="brand">ZEREX · PLAY · WIN · EARN</div><br />
      <div class="online">● 403 online</div>
    </div>

    <div class="menu-grid">
      <button class="btn-wood menu-btn" onclick="openPanel('tasks')">📋 VAZIFALAR</button>
      <button class="btn-wood menu-btn" onclick="openPanel('rating')">🏆 REYTING</button>
      <button class="btn-wood menu-btn" onclick="openPanel('shop')">🏪 DO‘KON</button>
      <button class="btn-wood menu-btn" onclick="openPanel('friend')">👥 DO‘ST BILAN</button>
      <button class="btn-wood menu-btn" onclick="openPanel('withdraw')">💵 PUL YECHISH</button>
      <button class="btn-wood menu-btn" onclick="openPanel('rules')">📜 QOIDALAR</button>
    </div>

    <div class="games-box">
      <div class="games-list" id="gamesList"></div>
    </div>

    <button class="btn-wood play-btn" onclick="openPanel('play')">PLAY</button>
    <div class="hint" id="hintText">Tanlangan o‘yin: Shashka · Tikuv: 3 G · Yutuq: 1.8x</div>

    <div class="panel" id="panelBox">
      <div class="panel-head">
        <div class="panel-title" id="panelTitle">Bo‘lim</div>
        <button class="close-x" onclick="closePanel()">Yopish</button>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </div>
  </div>

  <script>
    const games = [
      { id: "shashka", name: "⚫ Shashka" },
      { id: "shaxmat", name: "♞ Shaxmat" },
      { id: "bilyard", name: "🎱 Bilyard" },
      { id: "durak", name: "🃏 Durak" },
      { id: "mafia", name: "🕵️ Mafia" },
      { id: "xo", name: "✖️ X-O" }
    ];

    let currentGame = games[0];
    let balance = 8;
    let stake = 3;

    function updateUI() {
      document.getElementById("balText").textContent = balance + " G";
      document.getElementById("hintText").textContent =
        "Tanlangan o‘yin: " + currentGame.name.replace(/^[^\s]+\s/, "") +
        " · Tikuv: " + stake + " G · Yutuq: 1.8x";

      const list = document.getElementById("gamesList");
      list.innerHTML = "";
      games.forEach(function (g) {
        const btn = document.createElement("button");
        btn.className = "game-btn" + (g.id === currentGame.id ? " active" : "");
        btn.textContent = g.name;
        btn.onclick = function () {
          currentGame = g;
          updateUI();
          openPanel("play");
        };
        list.appendChild(btn);
      });
    }

    function openPanel(type) {
      const box = document.getElementById("panelBox");
      const title = document.getElementById("panelTitle");
      const body = document.getElementById("panelBody");
      box.classList.add("show");

      if (type === "play") {
        const prize = Math.floor(stake * 1.8);
        title.textContent = currentGame.name;
        body.innerHTML =
          "<p>Tikuv: <b>" + stake + " G</b> · Yutuq: <b>" + prize + " G (1.8x)</b></p>" +
          "<p>Vaqt: <b>6:30</b> umumiy · <b>50s</b> har yurishga · Raqib navbatida: <b>Raqib o‘ylamoqda...</b></p>" +
          "<div class='action-row'>" +
          "<button class='small-btn' onclick='changeStake(3)'>3 G</button>" +
          "<button class='small-btn' onclick='changeStake(10)'>10 G</button>" +
          "<button class='small-btn' onclick='changeStake(50)'>50 G</button>" +
          "<button class='small-btn' onclick='playRound(\"win\")'>G‘alaba (+ " + prize + " G)</button>" +
          "<button class='small-btn' onclick='playRound(\"draw\")'>Durrang</button>" +
          "</div>";
        return;
      }

      if (type === "deposit") {
        title.textContent = "💰 DEPOZIT";
        body.innerHTML =
          "<p>Karta: <b>6262 5702 3220 5437</b> (Esirgapov Sherzod)</p>" +
          "<p>Paket: <b>1 000 G = 11 000 so‘m</b></p>" +
          "<div class='action-row'>" +
          "<button class='small-btn' onclick='addCoins(1000)'>+1 000 G qo‘shish</button>" +
          "</div>";
        return;
      }

      if (type === "tasks") {
        title.textContent = "📋 VAZIFALAR";
        body.innerHTML =
          "<p>Vazifani bajarib tanga oling:</p>" +
          "<div class='action-row'><button class='small-btn' onclick='addCoins(1)'>Reklama ko‘rish (+1 G)</button></div>";
        return;
      }

      if (type === "rating") {
        title.textContent = "🏆 REYTING";
        body.innerHTML = "<p>1. @Oyinchi — " + balance + " G</p><p>2. Pokiza — 450 G</p><p>3. Javohir — 320 G</p>";
        return;
      }

      if (type === "shop") {
        title.textContent = "🏪 DO‘KON";
        body.innerHTML = "<p>Oltin ramka — 5 G</p><div class='action-row'><button class='small-btn' onclick='buyItem(5)'>Sotib olish (5 G)</button></div>";
        return;
      }

      if (type === "friend") {
        title.textContent = "👥 DO‘ST BILAN";
        body.innerHTML = "<p>Do‘stingiz bilan " + currentGame.name + " o‘ynash uchun tikuvni tanlang: <b>" + stake + " G</b>.</p>";
        return;
      }

      if (type === "withdraw") {
        title.textContent = "💵 PUL YECHISH";
        body.innerHTML = "<p>Joriy balans: <b>" + balance + " G</b>. Minimal yechish: <b>1 000 G</b>.</p>";
        return;
      }

      title.textContent = "📜 QOIDALAR";
      body.innerHTML = "<p>Shashkada toshni yutib olish majburiy. Har yurishga 50s, umumiy vaqt 6:30. Durrang ikki taraf roziligida.</p>";
    }

    function closePanel() {
      document.getElementById("panelBox").classList.remove("show");
    }

    function changeStake(val) {
      stake = val;
      updateUI();
      openPanel("play");
    }

    function addCoins(val) {
      balance += val;
      updateUI();
    }

    function buyItem(price) {
      if (balance < price) {
        alert("Balansda yetarli tanga yo‘q.");
        return;
      }
      balance -= price;
      updateUI();
    }

    function playRound(outcome) {
      if (balance < stake) {
        alert("Balansda yetarli tanga yo‘q.");
        return;
      }
      if (outcome === "win") {
        balance = balance - stake + Math.floor(stake * 1.8);
      }
      updateUI();
      openPanel("play");
    }

    try {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        const u = window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user;
        if (u && u.username) {
          document.getElementById("nickText").textContent = "@" + u.username;
        }
      }
    } catch (e) {}

    updateUI();
  </script>
</body>
</html>
